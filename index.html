<meta charset="utf-8">
<title>elsewhere</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="elsewhere">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* the immanence look: near-black, white, one gray — two accents: sun & night */
  :root {
    --bg: #121212;
    --s1: #ffffff;        /* primary ink */
    --s2: #84858c;        /* secondary ink */
    --s3: #4a4b52;        /* dim ink */
    --rule: #2e2e33;
    --focus: #ffffff;
    --warm: #a08558;       /* day, birds */
    --cool: #6e8494;       /* night, water */
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #fafafa; --s1: #121212; --s2: #85858c; --s3: #b9b9bf;
      --rule: #e4e4e6; --focus: #121212;
      --warm: #8a6f42; --cool: #5b7484;
    }
  }
  :root[data-theme="light"] {
    --bg: #fafafa; --s1: #121212; --s2: #85858c; --s3: #b9b9bf;
    --rule: #e4e4e6; --focus: #121212;
    --warm: #8a6f42; --cool: #5b7484;
  }
  /* the moth variation: deep night, wing-dust and violet, in any theme */
  :root.moth, :root.moth[data-theme="light"] {
    --bg: #08080c; --s1: #b9b4c4; --s2: #6d6878; --s3: #3c3946;
    --rule: #1b1a23; --focus: #b9b4c4;
    --warm: #9c9070; --cool: #7a7390;
  }
  /* faders that don't touch the moth atmosphere fall out of focus */
  .moth-idle { transition: opacity 0.7s ease, filter 0.7s ease; }
  :root.moth .moth-idle { opacity: 0.22; filter: blur(1.5px); pointer-events: none; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--s1);
    padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    font-family: Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 1.5; font-weight: 400;
  }
  .row { padding: 14px 16px; }
  /* the title floats over the globe, below the phone's clock; nothing to press
     there, so touches fall through */
  .row.head { position: absolute; top: env(safe-area-inset-top, 0px); left: 0; right: 0;
              z-index: 2; pointer-events: none;
              display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 16px; font-weight: 400; margin: 0; }
  .g { color: var(--s2); }

  #stage { position: relative; }
  #map { display: block; width: 100%; height: 380px; cursor: crosshair; touch-action: none; }
  #map:focus-visible { outline: 1px solid var(--focus); outline-offset: -2px; }
  #begin {
    /* a small centered button: the globe stays touchable around it */
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: 10px 16px; background: transparent; border: 0; cursor: pointer;
    color: var(--s1); font: inherit; letter-spacing: 0.02em;
  }
  #begin:hover { color: var(--s2); }
  #begin:focus-visible { outline: 1px solid var(--focus); outline-offset: -4px; }

  #siteline {
    padding: 10px 16px 4px; font-size: 13px;
    color: var(--s2); font-variant-numeric: tabular-nums; min-height: 34px;
  }
  #siteline b { color: var(--warm); font-weight: 400; }
  #voicesline {
    padding: 2px 16px 6px; font-size: 13px;
    color: var(--s3); min-height: 32px; font-style: italic;
  }
  #voicesline span { transition: opacity 3s; }

  .sect { padding: 18px 16px 2px; color: var(--s2); font-size: 13px; }
  .ctl { display: block; padding: 12px 16px 10px; }
  .ctl .row2 { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .ctl label { font-size: 16px; }
  .ctl output { font-size: 14px; color: var(--s2); font-variant-numeric: tabular-nums; }
  .ctl.warm output { color: var(--warm); }
  .ctl.cool output { color: var(--cool); }
  .ctl.warm input[type="range"]::-webkit-slider-thumb { background: var(--warm); }
  .ctl.cool input[type="range"]::-webkit-slider-thumb { background: var(--cool); }
  .ctl.warm input[type="range"]::-moz-range-thumb { background: var(--warm); }
  .ctl.cool input[type="range"]::-moz-range-thumb { background: var(--cool); }

  input[type="range"] {
    appearance: none; -webkit-appearance: none; width: 100%; height: 18px;
    background: transparent; cursor: pointer; margin: 0; display: block;
  }
  input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--rule); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%;
    background: var(--s1); margin-top: -5px; border: 0;
  }
  input[type="range"]::-moz-range-track { height: 1px; background: var(--rule); }
  input[type="range"]::-moz-range-thumb {
    width: 11px; height: 11px; border-radius: 50%; background: var(--s1); border: 0;
  }
  input[type="range"]:focus-visible { outline: 1px solid var(--focus); outline-offset: 4px; }

  .seg { display: flex; gap: 18px; flex-wrap: wrap; }
  .seg button, .act, .switch {
    background: transparent; border: 0; padding: 0; font: inherit; cursor: pointer;
    color: var(--s2); touch-action: manipulation;
  }
  /* hover only where there is a hover: a touch must not leave a switch looking on */
  @media (hover: hover) {
    .seg button:hover, .act:hover, .switch:hover { color: var(--s1); }
    .act:hover { color: var(--warm); }
    #moth:hover { color: var(--cool); }
  }
  .act[disabled] { color: var(--s3); cursor: default; }
  .switch[aria-checked="true"] { color: var(--s1); }
  /* the moth button wears the palette's cool blue — muted off, full on */
  #moth { color: color-mix(in srgb, var(--cool) 60%, var(--s2)); }
  #moth[aria-checked="true"] { color: var(--cool); }
  .seg button:focus-visible, .act:focus-visible, .switch:focus-visible {
    outline: 1px solid var(--focus); outline-offset: 4px;
  }
  .inline { display: flex; gap: 24px; align-items: baseline; flex-wrap: wrap;
            padding: 12px 16px; }
  .inline.between { justify-content: space-between; }
  .inline[hidden] { display: none; }
  #dubDepthWrap { display: inline-flex; align-items: center; gap: 10px; align-self: center; }
  #dubDepthWrap[hidden] { display: none; }
  #dubDepthWrap input[type="range"] { width: 110px; }
  #dubDepthWrap input[type="range"]::-webkit-slider-thumb { background: var(--cool); }
  #dubDepthWrap input[type="range"]::-moz-range-thumb { background: var(--cool); }
  #dubDepthWrap output { font-size: 13px; color: var(--cool); font-variant-numeric: tabular-nums; }

  @media (pointer: coarse) {
    input[type="range"] { height: 32px; }
    input[type="range"]::-webkit-slider-thumb { width: 20px; height: 20px; margin-top: -9.5px; }
    input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; }
    .seg button, .act, .switch { padding: 6px 0; }
  }
  @media (max-width: 480px) {
    /* on a phone the title takes the top of the page, the globe the whole
       width below it, and [ begin ] waits underneath rather than on top */
    #map { height: 300px; }
    .row.head { position: static; padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
    .row.head .g { font-size: 14px; }
    #begin { position: static; transform: none; display: block; margin: 0 auto; padding: 10px 16px 2px; }
  }
</style>

<div class="row head">
  <h1>[ elsewhere ]</h1>
  <span class="g">every place is singing</span>
</div>

<div id="stage">
  <canvas id="map" width="1024" height="380" tabindex="0"
    aria-label="The globe. Arrow keys turn it, plus and minus zoom, enter stands where it faces."></canvas>
  <button id="begin">[ begin ]</button>
</div>
<div id="siteline">spin the globe and tap land to listen</div>
<div id="voicesline"></div>

<div class="inline between">
  <div class="seg">
    <button class="act" id="jump" aria-label="Go somewhere else at random">[ elsewhere ]</button>
    <button class="switch" id="drift" role="switch" aria-checked="false"
      aria-label="Drift: the listener wanders the land">[ &infin; drift ]</button>
    <button class="switch" id="ride" role="switch" aria-checked="false"
      aria-label="Ride the dawn: move west with the sunrise so the chorus never ends">[ ride the dawn ]</button>
    <button class="switch" id="dub" role="switch" aria-checked="false"
      aria-label="Dub: the land through a tape echo">[ dub ]</button>
    <span id="dubDepthWrap" hidden>
      <input type="range" id="dubDepth" min="0" max="100" value="55" aria-label="How deep the dub sits">
      <output id="dubDepthV">55</output>
    </span>
  </div>
  <div class="seg">
    <button class="switch" id="sleep" role="switch" aria-checked="false"
      aria-label="Sleep timer: the world fades out in 30, 60 or 90 minutes">[ sleep ]</button>
    <button class="act" id="share" aria-label="Copy a link to this site and day">[ share this place ]</button>
  </div>
</div>

<div class="sect">when</div>
<div class="inline between">
  <div class="seg">
    <button class="switch" id="now" role="switch" aria-checked="true"
      aria-label="Follow the actual time at the site">[ now ]</button>
    <button class="switch" id="lapse" role="switch" aria-checked="false"
      aria-label="Time-lapse: a day passes in an hour">[ a day in an hour ]</button>
    <button class="switch" id="moth" role="switch" aria-checked="false"
      aria-label="The moth variation: deep night, and only the moths">[ moth variation ]</button>
  </div>
  <button class="act" id="today" aria-label="Set the season to today">[ today ]</button>
</div>
<div class="ctl warm">
  <div class="row2"><label for="hour">hour</label><output id="hourV">--:--</output></div>
  <input type="range" id="hour" min="0" max="1439" step="5" value="360"
         aria-label="Local solar time at the site">
</div>
<div class="ctl cool">
  <div class="row2"><label for="doy">season</label><output id="doyV">—</output></div>
  <input type="range" id="doy" min="1" max="365" step="1" value="160"
         aria-label="Day of the year">
</div>

<div class="sect">listening</div>
<div class="inline" id="headRow" hidden>
  <button class="switch" id="head" role="switch" aria-checked="false"
    aria-label="Turn with the phone: every voice stays where it is in the world as you turn">[ turn your head ]</button>
  <span class="g">the phone is the compass · headphones on</span>
</div>
<div class="ctl"><div class="row2"><label for="density">density</label><output id="densityV">60</output></div>
  <input type="range" id="density" min="0" max="100" value="60" aria-label="How many voices"></div>
<div class="ctl"><div class="row2"><label for="wind">wind</label><output id="windV">light airs</output></div>
  <input type="range" id="wind" min="0" max="100" value="35" aria-label="Wind strength"></div>
<div class="ctl"><div class="row2"><label for="space">space</label><output id="spaceV">40</output></div>
  <input type="range" id="space" min="0" max="100" value="40" aria-label="Openness of the air"></div>

<div class="sect">voices</div>
<div class="ctl warm moth-idle"><div class="row2"><label for="vBird">birds</label><output id="vBirdV">70</output></div>
  <input type="range" id="vBird" min="0" max="100" value="70" aria-label="Bird level"></div>
<div class="ctl"><div class="row2"><label for="vBug">insects</label><output id="vBugV">70</output></div>
  <input type="range" id="vBug" min="0" max="100" value="70" aria-label="Insect level"></div>
<div class="ctl cool moth-idle"><div class="row2"><label for="vFrog">frogs</label><output id="vFrogV">70</output></div>
  <input type="range" id="vFrog" min="0" max="100" value="70" aria-label="Frog level"></div>
<div class="ctl cool moth-idle"><div class="row2"><label for="vFauna">fauna</label><output id="vFaunaV">70</output></div>
  <input type="range" id="vFauna" min="0" max="100" value="70" aria-label="Mammal and beast level"></div>
<div class="ctl"><div class="row2"><label for="vAir">air &amp; water</label><output id="vAirV">70</output></div>
  <input type="range" id="vAir" min="0" max="100" value="70" aria-label="Wind and water level"></div>

def("veery", { name: "veery", g: "bird",

function drumRoll(strikes, rate, fc, decel = 1) {
  const mk = () => { const x = noiseA((0.006 * SR) | 0);
    for (let i = 0; i < x.length; i++) x[i] *= Math.exp(-i / (SR * 0.0018));
    return bpA(x, fc, 1.1); };
  return pulses(strikes, rate, mk, { accel: decel, jit: 0.03 });
}

    const parts = []; const f = ru(1100, 1300), m = ri(6, 10);
    for (let k = 0; k < m; k++) {
      const fk = f * (1 + 0.25 * Math.sin(Math.PI * k / (m - 1)));
      parts.push(tone(0.09, [[0, fk], [1, fk * 1.1]],
        { harm: [1, 0.6, 0.3], noise: 0.2, atk: 0.005, rel: 0.02 }));

    } return cat(...parts); } });

def("rgrouse", { name: "ruffed grouse drumming", g: "bird",

function cricketChirpBuf(f, npulse, pulseDur, pulsePer) {
  const dur = npulse * pulsePer + 0.02, n = (dur * SR) | 0, x = new Float32Array(n);
  for (let k = 0; k < npulse; k++) {
    const s = (k * pulsePer * (1 + ru(-0.04, 0.04)) * SR) | 0;
    const L = (pulseDur * SR) | 0;
    for (let i = 0; i < L && s + i < n; i++) {
      const t = i / SR;
      x[s + i] += (Math.sin(2 * Math.PI * f * t) + 0.08 * Math.sin(4 * Math.PI * f * t)
                 + 0.09 * (Math.random() * 2 - 1)) * Math.exp(-t / (pulseDur * 0.32));
    }
  }
  return x;
}

/* ============================================================= frogs ===== */
function chorusBuf(dur, nVoices, mkVoice, o = {}) {
  const n = (dur * SR) | 0, x = new Float32Array(n);
  if (o.phase !== false) {
    /* a phased chorus: the lowest voice leads and the rest sit a beat behind
       it — strict alternation in the gaps when they are few, a phase-locked
       smear when they are many; a voice sits one out now and then */
    const calls = []; for (let v = 0; v < nVoices; v++) calls.push({ ...mkVoice(), g: ru(0.3, 1) });
    calls.sort((a, b) => (a.f || 0) - (b.f || 0));
    const per = calls[0].per, few = nVoices <= 3;
    for (let t = ru(0, per); t < dur; t += per * ru(0.94, 1.08)) {
      calls.forEach((c, v) => {
        const at = t + (few ? per * v / nVoices : v * ru(0.04, 0.07));
        if (at < dur - c.x.length / SR && (v === 0 || Math.random() < 0.85))
          addTo(x, scaleA(c.x.slice(), c.g), (at * SR) | 0);
      });
    }
    return normA(x);
  }
  for (let v = 0; v < nVoices; v++) {
    const call = mkVoice(), per = call.per, cx = call.x, g = ru(0.3, 1);
    let t = ru(0, per);
    while (t < dur - cx.length / SR) {
      addTo(x, scaleA(cx.slice(), g), (t * SR) | 0);
      t += per * ru(0.9, 1.15);
    }
  }
  return normA(x);
}

def("train", { name: "a far train horn", g: "air",
  act: A({ doy: [1, 365], night: 0.8, dusk: 0.4 }), gap: [900, 2400], dist: [0.85, 0.95], n: [1, 1], rev: 0.5,
  gen() { /* each railway has its own voice: the american minor cluster,
             europe's two high tones, japan's near-unison pair */
    const realm = site ? site.realm : "nearctic";
    const chord = realm === "wpale" ? [370, 466]
      : realm === "epale" ? [440, 466]
      : realm === "indo" ? [349, 415]
      : [311, 370, 466, 233];
    const blast = (d, det) => { const n2 = (d * SR) | 0, x = new Float32Array(n2);
      const phs = chord.map(() => Math.random() * 6.28);
      for (let i = 0; i < n2; i++) {
        let s = 0;
        for (let c = 0; c < chord.length; c++)
          s += Math.sin(2 * Math.PI * chord[c] * det * (1 + 0.0007 * c) * i / SR + phs[c]);
        x[i] = s / chord.length;
      } return env3(x, 0.1, 0.25); };
    if (realm === "wpale" || realm === "epale")   /* two brief blasts and gone */
      return cat(blast(ru(0.8, 1.3), 1), gapN(ru(0.4, 0.7)), blast(ru(1.2, 1.8), 0.995));
    if (realm === "indo")                          /* one long insistent held tone */
      return cat(blast(ru(2.5, 4), 1), gapN(ru(0.5, 0.9)), blast(ru(1, 1.6), 0.99));
    return cat(blast(ru(1.5, 2.2), 1), gapN(ru(0.5, 0.9)),
               blast(ru(1.5, 2.2), 0.995), gapN(ru(0.4, 0.8)),
               blast(ru(0.7, 1), 0.99), gapN(ru(0.5, 0.9)),
               blast(ru(2.5, 3.5), 0.985)); } });

  gen() { const dur = ru(1, 1.8), n = (dur * SR) | 0, x = new Float32Array(n);
    let t = 0; const per = 1 / ru(14, 18);
    while (t < dur - 0.05) {   /* the mechanical rattle, flying past */
      const s = (t * SR) | 0, L = (0.03 * SR) | 0, f = ru(1700, 2200);
      for (let i = 0; i < L && s + i < n; i++) {
        const tt = i / SR;
        x[s + i] += (Math.sin(2 * Math.PI * f * tt) + 0.5 * Math.sin(2 * Math.PI * f * 2.1 * tt)
                   + 0.5 * (Math.random() * 2 - 1)) * Math.exp(-tt / 0.012);
      }
      t += per * ru(0.9, 1.1);
    }
    for (let i = 0; i < n; i++) x[i] *= Math.pow(Math.sin(Math.PI * i / n), 0.5);
    return normA(x); } });

/* --------------------------- the moths, as through a bat detector -------- */
function flutterBuf(dur, wingHz, bandHz, depth) {
  const n = (dur * SR) | 0, x = new Float32Array(n);
  const nz = bpA(noiseA(n), bandHz, 0.7);
  let phW = ru(0, 6.28), wander = 0;
  for (let i = 0; i < n; i++) {
    const tf = i / n;
    wander = 0.998 * wander + 0.002 * (Math.random() * 2 - 1);
    phW += 2 * Math.PI * wingHz * (1 + 0.5 * wander) / SR;
    const beat = Math.pow(0.5 + 0.5 * Math.sin(phW), depth);
    x[i] = nz[i] * beat * Math.pow(Math.sin(Math.PI * tf), 0.8)
         * (0.6 + 0.4 * Math.sin(2 * Math.PI * 0.9 * i / SR + 2));
  }
  return normA(x);
}

def("waxmoth", { name: "the wax moth, singing in the hive", g: "bug",
  act: A({ doy: [1, 365], tMin: 50, night: 1.2, dusk: 0.7 }), gap: [20, 45], dist: [0.15, 0.35], n: [1, 1],
  gen() { /* achroia: pulse-pairs from asynchronous wings, all night, until death */
    const dur = ru(3, 6), n = (dur * SR) | 0, x = new Float32Array(n);
    const wb = ru(35, 50), asym = ru(0.25, 0.4);
    const click = (at, g) => { const L = (0.002 * SR) | 0;
      for (let i = 0; i < L && at + i < n; i++)
        x[at + i] += (Math.random() * 2 - 1) * Math.exp(-i / (SR * 0.0005)) * g; };
    let t = 0;
    while (t < dur) {
      const base = (t * SR) | 0;
      click(base, 1); click(base + ((asym / wb * SR) | 0), 0.8);
      t += (1 / wb) * ru(0.97, 1.03);
    }
    const y = bpA(x, 5200, 1.8);
    for (let i = 0; i < n; i++) y[i] *= 0.85 + 0.15 * Math.sin(2 * Math.PI * 0.5 * i / SR);
    return env3(normA(y), 0.4, 0.8); } });
def("erminering", { name: "an ermine moth, ringing as it flies", g: "bug",
  act: A({ doy: [140, 250], tMin: 52, night: 1, dusk: 1.1 }), gap: [15, 40], dist: [0.04, 0.16], n: [1, 1],
  gen() { /* yponomeuta: deaf, and clicking on every wingbeat anyway */
    const dur = ru(1.2, 2.5), n = (dur * SR) | 0;
    const wb = ru(28, 40);
    const x = flutterBuf(dur, wb, 800, 2);
    const clicks = new Float32Array(n);
    let t = 0;
    while (t < dur) {
      const at = (t * SR) | 0, L = (0.0025 * SR) | 0;
      for (let i = 0; i < L && at + i < n; i++)
        clicks[at + i] += (Math.random() * 2 - 1) * Math.exp(-i / (SR * 0.0006));
      t += 1 / wb;
    }
    const cb = bpA(clicks, 4600, 2);
    for (let i = 0; i < n; i++)
      x[i] = x[i] * 0.6 + cb[i] * 0.7 * Math.pow(Math.sin(Math.PI * i / n), 0.8);
    return normA(x); } });
def("frassrain", { name: "the frass rain", g: "bug",
  act: A({ doy: [140, 185], day: 1, dawn: 0.8, dusk: 0.8, night: 0.6 }), gap: [4, 9], dist: [0.05, 0.3], n: [2, 3],
  gen() { /* an outbreak year: the canopy rains under a clear sky */
    const dur = ru(4, 8), n = (dur * SR) | 0, x = new Float32Array(n);
    let t = 0;
    while (t < dur) {
      const at = (t * SR) | 0, L = (0.004 * SR) | 0, f = ru(1800, 4200), g = ru(0.3, 1);
      for (let i = 0; i < L && at + i < n; i++)
        x[at + i] += Math.sin(2 * Math.PI * f * i / SR) * Math.exp(-i / (SR * 0.001)) * g;
      t += ru(0.01, 0.09);
    }
    const chew = bpA(noiseA(n), 6500, 1.2);   /* a million mandibles */
    for (let i = 0; i < n; i++)
      x[i] += chew[i] * 0.06 * (0.7 + 0.3 * Math.sin(2 * Math.PI * 0.3 * i / SR));
    return env3(normA(x), 0.8, 1.2); } });
def("bat", { name: "a bat, hunting", g: "bug",
  act: A({ doy: [100, 290], tMin: 48, night: 1.2, dusk: 1 }),
  gap: [25, 70], dist: [0.08, 0.3], n: [1, 1],
  gen() { const parts = [];
    let per = 0.14;   /* search chirps closing into the feeding buzz */
    for (let k = 0; k < 22 && per > 0.011; k++) {
      const f = ru(2300, 2700);
      parts.push(tone(Math.min(0.03, per * 0.5), [[0, f], [1, f * 0.55]],
        { harm: [1, 0.15], atk: 0.002, rel: 0.006 }));
      parts.push(gapN(Math.max(0.004, per - 0.03)));
      per *= 0.82;
    }
    parts.push(scaleA(rasp(0.18, 1900, 1.2, { am: 110, amd: 0.8, win: 0.4 }), 0.8));
    const outcome = Math.random();
    if (outcome < 0.35) {   /* the moth got away — its clicks say so */
      parts.push(gapN(0.1));
      const mk = () => { const L = (0.003 * SR) | 0, c = new Float32Array(L);
        for (let i = 0; i < L; i++) c[i] = (Math.random() * 2 - 1) * Math.exp(-i / (SR * 0.0007));
        return bpA(c, 4200, 1.5); };
      parts.push(pulses(ri(10, 18), 70, mk, { jit: 0.1 }));
    } else if (outcome < 0.55) {   /* bertholdia jams the buzz — a sheet of clicks */
      parts.push(gapN(0.05));
      const jd = ru(0.25, 0.5), jn = (jd * SR) | 0, jx = new Float32Array(jn);
      for (let i = 0; i < jn; i++) if (Math.random() < 0.32) jx[i] = Math.random() * 2 - 1;
      const jy = bpA(jx, 4200, 1.2);
      for (let i = 0; i < jn; i++) jy[i] *= Math.pow(Math.sin(Math.PI * i / jn), 0.5);
      parts.push(scaleA(normA(jy), 0.85));
    } else if (outcome < 0.72 && site
        && ["son", "chih", "des", "sage", "trf", "sav", "subtrop"].includes(site.biome)) {
      /* a hawkmoth answers with its genital rasp (barber & kawahara 2013) */
      parts.push(gapN(0.08));
      parts.push(scaleA(rasp(ru(0.15, 0.28), 3300, 1.6, { am: 55, amd: 0.9, win: 0.5 }), 0.7));
    }
    return cat(...parts); } });

function castWorld(biome, realm) {
  if (realm === "nearctic") {   /* canada, alaska, mexico: the US casts travel */
    const map = { bor: "bor", tfor: "efor", toce: "pnw", steppe: "sage", des: "son",
                  sav: "chih", subtrop: "sepine", med: "cal", shore: "pcoast" };
    if (map[biome]) return CASTS[map[biome]];
    if (biome === "tundra") return [...WBASE.tundra, "snowbunting", "diver", "raven", "wolf", "coyote"];
    if (biome === "trf") return [...WBASE.trf, "parrots", "gecko"];
    return WBASE[biome] || [];
  }
  const R = WREALM[realm] || {};
  return [...(WBASE[biome] || []), ...(R.all || []), ...(R[biome] || [])];
}

def("indri", { name: "indri, wailing across the valley", g: "beast",
  act: A({ doy: [1, 365], dawn: 0.8, day: 1 }), gap: [280, 700], dist: [0.4, 0.8], n: [1, 1], rev: 0.55, echo: true,
  gen() { /* the family sings together: long overlapping portamento wails */
    const dur = ru(6, 11), n2 = (dur * SR) | 0, x = new Float32Array(n2);
    for (let v = 0, m = ri(2, 4); v < m; v++) {
      let t = ru(0, 1.2);
      while (t < dur - 1.5) {
        const wd = ru(1, 2.2), f0 = ru(550, 900), f1 = f0 * ru(1.6, 2.3);
        const at = (t * SR) | 0, L = (wd * SR) | 0;
        let ph = 0;
        for (let i = 0; i < L && at + i < n2; i++) {
          const tf = i / L;
          const f = tf < 0.35 ? f0 + (f1 - f0) * (tf / 0.35) : f1 * (1 - 0.45 * (tf - 0.35) / 0.65);
          ph += 2 * Math.PI * f / SR;
          x[at + i] += (Math.sin(ph) + 0.4 * Math.sin(2 * ph) + 0.12 * Math.sin(3 * ph))
                     * Math.sin(Math.PI * tf) * 0.5;
        }
        t += wd * ru(0.7, 1.1);
      }
    }
    return env3(normA(x), 0.3, 1); } });

/* ------------------------------------------ the night sky: migration ----- */
/* on spring and autumn nights the sky carries a thin traffic of flight
   calls from birds a few hundred metres up: single notes, no room around
   them, each somewhere else in the dome. most nights are quiet; a few are
   rivers. the passage runs later in spring and earlier in autumn the
   farther from the equator; rain and a headwind ground it */

  const au = gauss(e.doy, 290 - (lat - 30) * 1.4, 24) * autumn;

/* ============================================================ engine ===== */
let running = false, wetGain, echoNode, echoGain, comp, master, conv = null;
let sum = null, space = null;   /* linear pre-comp mix bus + the reverb/echo return */
const groups = {};          /* bird/bug/frog/fauna/air -> {dry, wet} */
const GROUP_OF = { bird: "bird", bug: "bug", frog: "frog", beast: "fauna", air: "air" };
const FADER_OF = { bird: "vBird", bug: "vBug", frog: "vFrog", fauna: "vFauna", air: "vAir" };
let arng = Math.random;     /* scheduling rng, reseeded per site+day */
let wrng = Math.random;     /* weather rng */

function makeIR(family) {
  const specs = { forest: [1.4, 3400, 0.55], open: [1.9, 4200, 0.3],
                  canyon: [2.2, 3000, 0.5], beach: [0.7, 3800, 0.2], snow: [0.6, 2200, 0.25] };
  const [t60, lp, early] = specs[family] || specs.open;
  const n = (SR * Math.min(3, t60 * 1.4)) | 0, ir = ctx.createBuffer(2, n, SR);
  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c); let y = 0;
    const a = Math.exp(-2 * Math.PI * lp / SR);
    for (let i = 0; i < n; i++) {
      const t = i / SR;
      const nz = (Math.random() * 2 - 1) * Math.pow(10, -3 * t / t60) * Math.min(1, t / 0.02 + early * 0.3);
      y = a * y + (1 - a) * nz; d[i] = y * 3;
    }
  }
  return ir;
}

function mkbuf(x) { const b = ctx.createBuffer(1, x.length, SR); b.copyToChannel(x, 0); return b; }

const visEvents = [];
function play(x, when, o = {}) {
  /* o: dist 0..1, pan -1..1, gain, group, name, rev, echo, omni, fog, detune (cents) */
  if (!running || !x || !x.length) return 0;
  const dist = o.dist ?? 0.5;
  const fog = o.fog ?? weather.fog;
  /* a voice high overhead has no room around it; only the air thins it */
  let fc = o.sky ? 14000 - 6000 * dist : 11000 * Math.pow(2, -dist * 3.1);
  fc *= 1 - 0.45 * fog;
  const amp = (o.gain ?? 1) * Math.pow(1 - 0.82 * dist, 1.5);
  const src = ctx.createBufferSource(); src.buffer = mkbuf(x);
  src.playbackRate.value = Math.pow(2, ((o.detune || 0) + ru(-4, 4)) / 1200);
  const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = Math.max(300, fc); lp.Q.value = 0.4;
  const g = ctx.createGain(); g.gain.value = amp;
  const az = (o.pan ?? 0) * 90;   /* the voice's bearing, degrees off the listener's nose */
  const pan = ctx.createStereoPanner();
  pan.pan.value = o.omni ? 0 : (o.pan ?? 0) * (1 - 0.45 * dist);
  src.connect(lp); lp.connect(g); g.connect(pan);
  const grp = groups[o.group || "air"];
  pan.connect(grp.dry);
  const wet = ctx.createGain();
  wet.gain.value = o.sky ? 0.03 : (o.rev ?? 0.15) + 0.55 * dist;
  pan.connect(wet); wet.connect(grp.wet);
  if (o.echo) { const eg = ctx.createGain(); eg.gain.value = 0.5; pan.connect(eg); eg.connect(echoNode); }
  if (DUB.on && DUB.n) {   /* offer this voice to the dub's throw gate */
    const ds = ctx.createGain();
    ds.gain.value = MOTH.on && (o.group === "bug")
      ? 0.75   /* in the moth variation, the moths are what the dub eats */
      : ({ bird: 0.9, frog: 0.7, fauna: 0.6, bug: 0.22, air: 0.12 }[o.group || "air"] ?? 0.3);
    pan.connect(ds); ds.connect(DUB.n.throw);
  }
  src.start(when);
  const durS = x.length / SR;
  src.stop(when + durS + 0.1);
  if (!o.omni) {   /* every voice keeps its bearing, so a turn can take the ones already sounding */
    const v = { pan, lp, g, az, dist, fc: lp.frequency.value, amp, until: when + durS + 0.3 };
    if (HEAD.on) aimVoice(v, null);
    /* only what is still sounding is kept: a held voice is a held buffer */
    if (HEAD.live.length > 24) HEAD.live = HEAD.live.filter(u => u.until > when);
    HEAD.live.push(v);
    if (HEAD.live.length > 120) HEAD.live.shift();
  }
  if (o.name) visEvents.push({ t: when, name: o.name, pan: o.pan ?? 0, dist, dur: durS });
  return durS;
}

/* ------------------------------------------------------------- beds ------ */
/* continuous atmosphere: a looping noise source through parallel taps whose
   gains/filters the tick steers (gusts, rain, surf swell). event-shaped
   water (waves, laps, bubbles) is rendered buffers on the scheduler. */
let bed = null;
function noiseLoopSrc() {
  const n = SR * 4, b = ctx.createBuffer(2, n, SR);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; }
  const s = ctx.createBufferSource(); s.buffer = b; s.loop = true; s.start();
  return s;
}
function tap(src, type, freq, q, gain, dest) {
  const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ctx.createGain(); g.gain.value = gain;
  src.connect(f); f.connect(g); g.connect(dest);
  return { f, g };
}
function buildBed() {
  if (bed) {   /* let the old country fade behind us */
    const old = bed, now = ctx.currentTime;
    old.out.gain.setTargetAtTime(0, now, 0.9);
    old.outWet.gain.setTargetAtTime(0, now, 0.9);
    try { old.src.stop(now + 4.5); } catch {}
    setTimeout(() => { for (const n of old.nodes) { try { n.disconnect(); } catch {} }
      try { old.out.disconnect(); old.outWet.disconnect(); } catch {} }, 5000);
  }
  const out = ctx.createGain(), outWet = ctx.createGain();
  out.gain.value = 0; outWet.gain.value = 0;
  outWet.connect(groups.air.wet);
  out.gain.setTargetAtTime(1, ctx.currentTime + 0.05, 1.1);
  outWet.gain.setTargetAtTime(1, ctx.currentTime + 0.05, 1.1);

    const p = ctx.createStereoPanner(); p.pan.value = Math.sin(az * Math.PI / 180);
    split.connect(p, i); p.connect(groups.air.dry);
    ears.push({ pan: p, az, dist: 0.5, until: Infinity });
  });
  out.connect(split); nodes.push(split, ...ears.map(e => e.pan));
  HEAD.fixed = ears;
  if (HEAD.on) for (const v of ears) aimVoice(v, null);
  const t = {};
  /* vegetation band per biome: [freq, q, base gain] */
  const veg = { efor: [2400, 0.6, 0.5], bor: [700, 0.7, 0.45], sepine: [1000, 0.8, 0.4],
                flwet: [3000, 0.7, 0.35], tgrass: [5200, 0.6, 0.5], sgrass: [4800, 0.7, 0.4],
                son: [1800, 1.2, 0.2], chih: [3600, 0.9, 0.25], sage: [900, 0.8, 0.35],
                mont: [600, 0.7, 0.55], pnw: [500, 0.7, 0.55], cal: [3400, 0.7, 0.4],
                acoast: [4400, 0.8, 0.4], pcoast: [1200, 0.8, 0.4],
                trf: [2800, 0.6, 0.55], sav: [4800, 0.6, 0.5], des: [1500, 1, 0.2],
                steppe: [1000, 0.8, 0.35], med: [3200, 0.7, 0.4], subtrop: [1400, 0.8, 0.45],
                toce: [1800, 0.7, 0.5], tfor: [2400, 0.6, 0.5], tundra: [700, 0.8, 0.4],
                ice: [400, 0.7, 0.55], shore: [4400, 0.8, 0.4],
                sea: [600, 0.65, 0.5] }[site.biome] || [2000, 0.8, 0.4];
  t.low = tap(src, "lowpass", 130, 0.5, 0.02, dest);        /* air floor */
  t.moan = tap(src, "bandpass", 240, 1.2, 0.0, dest);       /* wind body */
  t.veg = tap(src, "bandpass", veg[0], veg[1], 0.0, dest);  /* vegetation */
  t.hiss = tap(src, "highpass", 5200, 0.5, 0.0, dest);      /* grass/needle hiss */
  t.vegWet = ctx.createGain(); t.vegWet.gain.value = 0.15;
  t.veg.g.connect(t.vegWet); t.vegWet.connect(wet);
  /* water washes */
  if (site.water.stream) {
    t.st1 = tap(src, "bandpass", 700, 1.4, 0.014, dest);
    t.st2 = tap(src, "bandpass", 1900, 1.6, 0.01, dest);
    t.st3 = tap(src, "bandpass", 3600, 2, 0.006, dest);
  }
  if (site.water.surf || site.water.lakeSurf || site.water.swell) {
    t.rumble = tap(src, "lowpass", 190, 0.6, 0.05, dest);
    t.swash = tap(src, "bandpass", 1100, 0.7, 0.0, dest);

    t.fum = tap(src, "bandpass", 2400, 0.45, 0.0, dest);

  set(t.moan.g.gain, 0.05 * g * g);
  set(t.veg.g.gain, bed.veg[2] * 0.09 * Math.pow(g, 1.6));
  t.veg.f.frequency.setTargetAtTime(bed.veg[0] * (1 + 0.35 * g), now, T);
  const grassy = ["tgrass", "sgrass", "acoast", "cal", "sage",
                  "sav", "steppe", "med", "tundra", "shore"].includes(site.biome) ? 1 : 0.3;
  set(t.hiss.g.gain, 0.02 * grassy * Math.pow(g, 2));
  set(t.low.g.gain, 0.022 + 0.02 * g);
  if (t.rumble) {
    const swell = 0.045 + 0.02 * Math.sin(now * 0.42 + 1);
    set(t.rumble.g.gain, (site.water.lakeSurf ? 0.4 : 1) * swell);
  }
  if (t.fum) {
    const breath = 0.8 + 0.2 * Math.sin(now * 0.9 + 2) * Math.sin(now * 0.23);
    set(t.fum.g.gain, 0.03 * site.geo.fum * breath);
    set(t.fumLow.g.gain, 0.03 * site.geo.fum);
  }
  set(t.rain.g.gain, weather.rain * 0.05);
  /* rain suppresses; gusts duck the distant bed a touch via master wet */
}

/* --------------------------------------------- scheduled water events ---- */
function waveBuf(big) {
  /* one breaking wave: build -> break -> wash with shell rattle */
  const dur = ru(5, 8), n = (dur * SR) | 0, x = new Float32Array(n);
  const bld = bpA(noiseA(n), 300, 0.8), brk = bpA(noiseA(n), 1400, 0.6), wsh = bpA(noiseA(n), 3200, 0.7);
  const tb = ru(0.3, 0.42);       /* break point */
  for (let i = 0; i < n; i++) {
    const tf = i / n;
    const build = tf < tb ? Math.pow(tf / tb, 2.2) : Math.max(0, 1 - (tf - tb) * 6);
    const crash = tf < tb ? 0 : Math.exp(-(tf - tb) * 5.5);
    const wash = tf < tb ? 0 : Math.exp(-(tf - tb) * 2.6) * (0.6 + 0.4 * Math.sin(2 * Math.PI * 2.1 * tf * dur));
    x[i] = bld[i] * build * 0.7 + brk[i] * crash * big + wsh[i] * wash * 0.5;
  }
  /* shell/pebble rattle in the backwash */
  const rs = ((tb + 0.12) * n) | 0;
  for (let k = 0, m = ri(20, 45); k < m; k++) {
    const at = rs + (ru(0, 0.4) * n) | 0;
    const L = (0.004 * SR) | 0;
    for (let i = 0; i < L && at + i < n; i++)
      x[at + i] += (Math.random() * 2 - 1) * Math.exp(-i / (SR * 0.001)) * 0.12 * Math.exp(-((at + i) / n - tb) * 3);
  }
  return normA(x);
}
function swellBuf() {
  /* mid-ocean: no shore to break on — a long rolling heave */
  const dur = ru(4, 7), n = (dur * SR) | 0;
  const x = bpA(noiseA(n), ru(280, 420), 0.7);
  const x2 = bpA(noiseA(n), 1400, 0.8);
  for (let i = 0; i < n; i++) {
    const tf = i / n;
    const env = Math.pow(Math.sin(Math.PI * tf), 1.6);
    x[i] = (x[i] * 2.2 + x2[i] * (0.3 + 0.5 * tf)) * env;
  }
  return normA(x);
}
function lapBuf() {
  const dur = ru(0.5, 1), n = (dur * SR) | 0;
  const x = bpA(noiseA(n), ru(400, 800), 1.1);
  for (let i = 0; i < n; i++) x[i] *= Math.pow(Math.sin(Math.PI * i / n), 1.4);
  return normA(x);
}
function bubbleBuf() {
  const n = (0.06 * SR) | 0, x = new Float32Array(n);
  const f = ru(400, 1100);
  for (let i = 0; i < n; i++) { const t = i / SR;
    x[i] = Math.sin(2 * Math.PI * f * (1 + 3 * t) * t) * Math.exp(-t / 0.018); }
  return x;
}
function dripBuf() {
  const n = (0.12 * SR) | 0, x = new Float32Array(n);
  const f = ru(700, 1400);
  for (let i = 0; i < n; i++) { const t = i / SR;
    x[i] = Math.sin(2 * Math.PI * f * (1 + 6 * Math.exp(-t / 0.01)) * t) * Math.exp(-t / 0.03); }
  return scaleA(x, 0.5);
}
function thunderBuf(far) {
  const dur = ru(4, 9), n = (dur * SR) | 0;
  const x = bpA(noiseA(n), far ? 55 : 80, 0.5);
  const rolls = ri(2, 4);
  for (let i = 0; i < n; i++) {
    const tf = i / n; let env = 0;
    for (let r = 0; r < rolls; r++) {
      const c = 0.1 + 0.8 * r / rolls;
      env += Math.exp(-Math.pow((tf - c) * 7, 2)) * (1 - 0.2 * r);
    }
    x[i] *= env * 3;
  }
  if (!far) {  /* near strike: initial crack */
    const c = noiseA((0.08 * SR) | 0);
    for (let i = 0; i < c.length; i++) c[i] *= Math.exp(-i / (SR * 0.02)) * 0.9;
    addTo(x, hpA(c, 900), 0);
  }
  return normA(x);
}
const waterEvents = [];   /* [{nextT, kind}] built per site */
function buildWaterEvents() {
  waterEvents.length = 0;
  const w = site.water;
  if (w.surf) waterEvents.push({ kind: "wave", per: [6, 12], nextT: 0 });
  if (w.swell) waterEvents.push({ kind: "swell", per: [4, 8], nextT: 0 });
  if (w.lakeSurf) waterEvents.push({ kind: "lakewave", per: [3, 7], nextT: 0 });
  if (w.lake && !w.lakeSurf) waterEvents.push({ kind: "lap", per: [1.5, 4], nextT: 0 });
  if (w.stream) waterEvents.push({ kind: "bubble", per: [0.4, 1.6], nextT: 0 });
  if (w.marsh || site.biome === "flwet") waterEvents.push({ kind: "plop", per: [8, 25], nextT: 0 });
  buildEarthEvents();
}
function scheduleWater(now, horizon) {
  for (const ev of waterEvents) {
    if (ev.nextT < now - 1) ev.nextT = now + ru(0, 1);
    while (ev.nextT < now + horizon) {
      const t = ev.nextT;
      const vA = P.vAir * (MOTH.on ? 0.35 : 1);
      if (ev.kind === "wave")
        play(waveBuf(ru(0.7, 1.15)), t, { dist: ru(0.15, 0.35), pan: ru(-0.7, 0.7), gain: 0.75 * vA, group: "air", rev: 0.08 });
      else if (ev.kind === "swell")
        play(swellBuf(), t, { dist: ru(0.1, 0.4), pan: ru(-0.8, 0.8), gain: 0.5 * vA, group: "air", rev: 0.12 });
      else if (ev.kind === "lakewave")
        play(waveBuf(ru(0.25, 0.5)), t, { dist: ru(0.25, 0.5), pan: ru(-0.7, 0.7), gain: 0.4 * vA, group: "air", rev: 0.1 });
      else if (ev.kind === "lap")
        play(lapBuf(), t, { dist: ru(0.2, 0.5), pan: ru(-0.8, 0.8), gain: 0.28 * vA, group: "air", rev: 0.1 });
      else if (ev.kind === "bubble")
        play(bubbleBuf(), t, { dist: ru(0.1, 0.4), pan: ru(-0.5, 0.5), gain: ru(0.1, 0.3) * vA, group: "air", rev: 0.1 });
      else if (ev.kind === "plop")
        play(bubbleBuf(), t, { dist: ru(0.3, 0.6), pan: ru(-0.8, 0.8), gain: ru(0.15, 0.4) * vA, group: "air", rev: 0.25 });
      ev.nextT = t + ru(ev.per[0], ev.per[1]);
    }
  }
  /* rain drops & canopy drips */
  if (weather.rain > 0.05) {
    const rate = 4 + weather.rain * 30;
    let t = now + ru(0, 1 / rate);
    while (t < now + horizon) {
      play(dripBuf(), t, { dist: ru(0.05, 0.5), pan: ru(-0.9, 0.9), gain: ru(0.1, 0.4) * weather.rain * P.vAir, group: "air", rev: 0.1 });
      t += ru(0.3, 1.5) / rate * 2;
    }
  }
  if (weather.drip > 0.05 && arng() < weather.drip * 0.5) {
    play(dripBuf(), now + ru(0, horizon), { dist: ru(0.05, 0.4), pan: ru(-0.9, 0.9), gain: ru(0.1, 0.35) * P.vAir, group: "air", rev: 0.2 });
  }
}

function geothermalAt(lon, lat) {
  const ky = Math.cos(lat * Math.PI / 180) * 111;
  for (const f of GEOTHERMAL)
    if (Math.hypot((f.lon - lon) * ky, (f.lat - lat) * 111) <= f.r) return f;
  return null;
}
function geyserBuf(dur) {   /* preplay splashes, then the roar, the column, the fall-off */
  const n = (dur * SR) | 0, x = new Float32Array(n);
  const roar = bpA(noiseA(n), 180, 0.5), hiss = hpA(bpA(noiseA(n), 3200, 0.35), 1200);
  for (let i = 0; i < n; i++) {
    const tf = i / n, t = i / SR;
    const rise = Math.min(1, tf / 0.12), fall = tf < 0.6 ? 1 : Math.max(0, 1 - (tf - 0.6) / 0.4);
    const env = Math.pow(rise, 1.5) * fall;
    const surge = 0.7 + 0.3 * Math.sin(2 * Math.PI * 0.35 * t + Math.sin(t * 0.7));
    x[i] = (roar[i] * 1.6 + hiss[i] * 1.2 * surge) * env;
  }
  for (let k = 0, m = ri(3, 7); k < m; k++) {
    const at = (ru(0, 0.1) * n) | 0, L = (0.3 * SR) | 0;
    const s = bpA(noiseA(L), ru(400, 900), 1.2);
    for (let i = 0; i < L && at + i < n; i++) x[at + i] += s[i] * Math.exp(-i / (SR * 0.08)) * 0.8;
  }
  return normA(x);
}
function mudBuf() {   /* a mud pot's plop: a slow bubble through the skin */
  const dur = ru(0.08, 0.16), n = (dur * SR) | 0, x = new Float32Array(n);
  const f = ru(60, 180);
  for (let i = 0; i < n; i++) { const t = i / SR;
    x[i] = Math.sin(2 * Math.PI * f * (1 + 2.5 * Math.exp(-t / 0.02)) * t) * Math.exp(-t / (dur * 0.35)); }
  const sp = bpA(noiseA((0.03 * SR) | 0), 1800, 1);
  for (let i = 0; i < sp.length && i < n; i++) x[i] += sp[i] * 0.5 * Math.exp(-i / (SR * 0.006));
  return normA(x, 0.9);
}
function boilBuf() {   /* a spring at the boil: a burst of bubbles */
  const dur = ru(0.4, 1.2), n = (dur * SR) | 0, x = new Float32Array(n);
  for (let k = 0, m = ri(4, 14); k < m; k++) addTo(x, scaleA(bubbleBuf(), ru(0.3, 1)), (ru(0, dur - 0.07) * SR) | 0);
  for (let i = 0; i < n; i++) x[i] *= Math.pow(Math.sin(Math.PI * i / n), 0.5);
  return normA(x);
}
const earthEvents = [];   /* built per site alongside the water */
function buildEarthEvents() {
  earthEvents.length = 0;
  const g = site.geo; if (!g) return;
  const gr = mulberry32(fnv("earth:" + site.key + ":" + dayStr));
  for (const gy of g.geysers) earthEvents.push({ kind: "geyser", gy, rng: gr, nextH: ru2(gr, 0, gy.per[1]) });
  if (g.mud) earthEvents.push({ kind: "mud", per: [3 / g.mud, 12 / g.mud], nextT: 0 });
  if (g.boil) earthEvents.push({ kind: "boil", per: [2 / g.boil, 8 / g.boil], nextT: 0 });
}
function scheduleEarth(now, e, horizon) {
  if (!earthEvents.length) return;
  const hm = e.hour * 60, vA = P.vAir * (MOTH.on ? 0.35 : 1);
  for (const ev of earthEvents) {
    if (ev.kind === "geyser") {
      /* on the clock of the day, so [ a day in an hour ] brings every eruption round */
      const d = (hm - ev.nextH + 1440) % 1440;
      if (d < 20) {
        const dur = Math.min(24, ru2(ev.rng, ev.gy.dur[0], ev.gy.dur[1]) / (P.lapse ? 24 : 1));
        const name = ev.gy.name;
        synth({ fn: "geyserBuf", args: [Math.max(6, dur)] }, x => {
          if (!x || !running) return;
          play(x, ctx.currentTime + ru(0.1, 0.5), { dist: ru(0.2, 0.45), pan: ru(-0.7, 0.7),
            gain: 0.9 * vA, group: "air", rev: 0.2, name });
          announce(name, 0.3);
        });
      }
      if (d < 720) ev.nextH = (ev.nextH + ru2(ev.rng, ev.gy.per[0], ev.gy.per[1])) % 1440;
      continue;
    }
    if (ev.nextT < now - 1) ev.nextT = now + ru(0, 1);
    while (ev.nextT < now + horizon) {
      const t = ev.nextT;
      if (ev.kind === "mud")
        play(mudBuf(), t, { dist: ru(0.15, 0.5), pan: ru(-0.8, 0.8), gain: ru(0.3, 0.7) * vA, group: "air", rev: 0.15 });
      else play(boilBuf(), t, { dist: ru(0.15, 0.45), pan: ru(-0.7, 0.7), gain: ru(0.15, 0.4) * vA, group: "air", rev: 0.12 });
      ev.nextT = t + ru(ev.per[0], ev.per[1]);
    }
  }
}

/* =============================================================== dub ===== */
/* [ dub ] — the land through a tape echo. the field recording keeps
   playing untouched; a rhythmic throw gate catches voices into a wobbling,
   saturated feedback delay, under muted chord stabs and a soft sub pulse
   rooted in the site's own key. the treatment drifts on its own weather
   (washing / sparse / deep / receding), seeded by the day. after topdown
   dialectic — smear, haze, no drums. */
const DUB = {
  on: false, beat: 0, nextT: -1, bpm: 72,
  drng: Math.random, state: "washing", stateBeats: 64,
  pattern: [1, 0, 0, 1, 0, 1, 0, 0], throwLevel: 0.75,
  fb: 0.42, lpf: 1250, chordEvery: 8, chordProb: 0.6, chordSoft: false,
  voicing: 0, subLevel: 0.5, n: null,
};
const DUB_VOICINGS = [[0, 3, 7, 10, 14], [0, 5, 10, 15], [0, 5, 7, 12], [0, 3, 10, 17]];
function dubRoot() {   /* the place has a key */
  let hz = 55 * Math.pow(2, (fnv(site ? site.key : "nowhere") % 12) / 12);
  while (hz > 62) hz /= 2; while (hz < 38) hz *= 2;
  return hz;
}
function buildDub() {
  if (DUB.n) return;
  const n = {};
  n.throw = ctx.createGain(); n.throw.gain.value = 0;
  n.in = ctx.createGain(); n.in.gain.value = 1;
  /* two lowpass stages in the loop: every repeat darkens twice over */
  n.lp = ctx.createBiquadFilter(); n.lp.type = "lowpass"; n.lp.frequency.value = DUB.lpf; n.lp.Q.value = 0.6;
  n.lp2 = ctx.createBiquadFilter(); n.lp2.type = "lowpass"; n.lp2.frequency.value = DUB.lpf * 1.4; n.lp2.Q.value = 0.4;
  n.hp = ctx.createBiquadFilter(); n.hp.type = "highpass"; n.hp.frequency.value = 290;
  n.shaper = ctx.createWaveShaper();
  /* unity small-signal slope, or the feedback loop self-oscillates */
  const curve = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) { const x = i / 511.5 - 1; curve[i] = Math.tanh(1.7 * x) / 1.7; }
  n.shaper.curve = curve;
  n.dA = ctx.createDelay(3); n.dB = ctx.createDelay(3);
  n.fbA = ctx.createGain(); n.fbA.gain.value = DUB.fb;
  n.fbB = ctx.createGain(); n.fbB.gain.value = DUB.fb * 0.7;
  for (const [d, rate, depth] of [[n.dA, 0.29, 0.0035], [n.dB, 0.21, 0.005]]) {
    const o = ctx.createOscillator(), og = ctx.createGain();   /* tape wow */
    o.frequency.value = rate; og.gain.value = depth;
    o.connect(og); og.connect(d.delayTime); o.start();
  }
  n.throw.connect(n.in); n.in.connect(n.lp); n.lp.connect(n.lp2); n.lp2.connect(n.hp);
  n.hp.connect(n.shaper);
  n.shaper.connect(n.dA); n.shaper.connect(n.dB);
  n.dA.connect(n.fbA); n.fbA.connect(n.lp);
  n.dB.connect(n.fbB); n.fbB.connect(n.lp);
  n.pA = ctx.createStereoPanner(); n.pA.pan.value = -0.32;
  n.pB = ctx.createStereoPanner(); n.pB.pan.value = 0.34;
  n.echoOut = ctx.createGain(); n.echoOut.gain.value = 1.5;
  n.dA.connect(n.pA); n.pA.connect(n.echoOut);
  n.dB.connect(n.pB); n.pB.connect(n.echoOut);
  n.mix = ctx.createGain(); n.mix.gain.value = 0;
  n.echoOut.connect(n.mix);
  n.chDry = ctx.createGain(); n.chDry.gain.value = 0.16; n.chDry.connect(n.mix);
  n.subG = ctx.createGain(); n.subG.gain.value = 1; n.subG.connect(n.mix);
  n.mix.connect(sum);
  n.wet = ctx.createGain(); n.wet.gain.value = 0.22;
  n.mix.connect(n.wet); n.wet.connect(wetGain);
  DUB.n = n;
}
function dubSpb() { return 60 / DUB.bpm; }
function startDub() {
  buildDub();
  DUB.drng = mulberry32(fnv("dub:" + (site ? site.key : "x") + ":" + dayStr));
  DUB.bpm = 66 + Math.floor(DUB.drng() * 12);
  DUB.beat = 0; DUB.nextT = ctx.currentTime + 0.3;
  dubDelays(ctx.currentTime);
  dubDrift(true);
  DUB.n.mix.gain.setTargetAtTime(P.dubDepth * 0.85, ctx.currentTime, 2.5);
}
function stopDub() {
  if (!DUB.n) return;
  DUB.n.mix.gain.setTargetAtTime(0, ctx.currentTime, 1.8);
  DUB.n.throw.gain.setTargetAtTime(0, ctx.currentTime, 0.5);
}
function dubDelays(t) {   /* tempo-synced; retunes glide like tape */
  const spb = dubSpb();
  DUB.n.dA.delayTime.setTargetAtTime(spb * DUB.divA, t, 0.6);
  DUB.n.dB.delayTime.setTargetAtTime(spb * DUB.divB, t, 0.8);
}
DUB.divA = 0.75; DUB.divB = 1.5;
function chordStab(t) {
  const root = dubRoot() * 2, v = DUB_VOICINGS[DUB.voicing];
  const dur = DUB.chordSoft ? ru(0.9, 1.4) : ru(0.35, 0.6);
  const nn = (dur * SR) | 0, x = new Float32Array(nn);
  for (const semi of v) {
    for (const det of [-0.0012, 0.0014]) {

    const peek = makeSite(lon, lat);   /* look before standing: no wasted builds */
    if (!peek) continue;
    if (peek.biome === "ice" && k < 380) continue;   /* don't strand the
      listener on the icecap — it can still be chosen by hand */
    setSite(lon, lat);
    if (site) globeCenter(site.lon, site.lat);
    return;
  }
}

/* ------------------------------------------------------------ sleep ------ */
/* [ sleep ] — the world fades over its last minutes and goes under. the tick
   keeps its thread (there is no road back to [ begin ]) but stops singing,
   the screen is let go, and a touch of the button wakes it where it stood */
const SLEEP = { min: 0, endT: 0, asleep: false, fade: 300, lock: null, shown: "" };
const SLEEP_STEPS = [0, 30, 60, 90];
function holdScreen() {
  if (!navigator.wakeLock || SLEEP.asleep) return;
  navigator.wakeLock.request("screen").then(l => { SLEEP.lock = l; }).catch(() => {});
}
function sleepLabel() {
  if (SLEEP.asleep) return "[ asleep ]";
  if (!SLEEP.min) return "[ sleep ]";
  const left = Math.max(1, Math.ceil((SLEEP.endT - performance.now()) / 60000));
  return "[ sleep in " + left + " min ]";
}
function reflectSleep() {
  const s = sleepLabel();
  if (s !== SLEEP.shown) { SLEEP.shown = s; el.sleep.textContent = s; }
  el.sleep.setAttribute("aria-checked", String(SLEEP.min > 0 || SLEEP.asleep));
}
function stepSleep(now) {
  if (!SLEEP.min || SLEEP.asleep) return;
  const left = (SLEEP.endT - performance.now()) / 1000;
  if (left <= 0) { fallAsleep(); return; }
  if (master && left < SLEEP.fade) {
    /* by ear, not by amplitude: a straight line down to −50 dB */
    const frac = 1 - left / SLEEP.fade;
    master.gain.setTargetAtTime(0.9 * Math.pow(10, -2.5 * frac), now, 0.3);
  }
  reflectSleep();
}
function fallAsleep() {
  SLEEP.asleep = true; SLEEP.min = 0;
  if (master && ctx) master.gain.setTargetAtTime(0, ctx.currentTime, 0.2);
  if (SLEEP.lock) { SLEEP.lock.release().catch(() => {}); SLEEP.lock = null; }
  setTimeout(() => { if (SLEEP.asleep && ctx) ctx.suspend().catch(() => {}); }, 1500);
  reflectSleep();
  if (site) statusLine(envNow());
}
function wake() {
  SLEEP.asleep = false;
  if (ctx) ctx.resume().catch(() => {});
  if (master && ctx) master.gain.setTargetAtTime(0.9, ctx.currentTime, 1.2);
  holdScreen();
  reflectSleep();
}
/* before [ begin ] there is no tick to carry the countdown */
setInterval(() => { if (!running) stepSleep(0); }, 5000);

/* ---------------------------------------------------- turn your head ----- */
/* on a phone the field can stay fixed to the world: turn, and the thrush
   stays where it was. every voice keeps the bearing it was placed at, and
   the compass turns the whole field, live. the way you faced when you
   pressed the button is north */
const HEAD = { on: false, yaw: 0, aimed: 0, zero: null, prev: null, live: [], fixed: [], lastT: 0, shownT: 0 };
const wrapDeg = x => ((x % 360) + 540) % 360 - 180;   /* always -180..180, whatever the sign */
function aimVoice(v, t, tau) {
  /* a bearing off the nose → stereo, by the ear's own symmetry; what is behind
     the head is dulled and a touch quieter, which is how you know it is behind */
  const rel = (v.az - HEAD.yaw) * Math.PI / 180, behind = (1 - Math.cos(rel)) / 2;
  const pan = Math.sin(rel) * (1 - 0.25 * v.dist), fc = v.fc * (1 - 0.45 * behind), amp = v.amp * (1 - 0.25 * behind);
  if (t == null) { v.pan.pan.value = pan; if (v.lp) { v.lp.frequency.value = fc; v.g.gain.value = amp; } return; }
  v.pan.pan.setTargetAtTime(pan, t, tau);
  if (v.lp) { v.lp.frequency.setTargetAtTime(fc, t, tau); v.g.gain.setTargetAtTime(amp, t, tau); }
}
function aimAll(t, tau) {
  HEAD.live = HEAD.live.filter(v => v.until > t);
  for (const v of HEAD.live) aimVoice(v, t, tau);
  for (const v of HEAD.fixed) aimVoice(v, t, tau);
}
function onHeading(ev) {
  /* north is the way you faced at the button, so only a relative turn is
     needed: alpha, fused from the gyro, smooth and needing no magnetometer;
     the compass only when there is no alpha, and only while it calls itself
     valid — on ios an absent compass reads as a plain zero */
  let h;
  if (Number.isFinite(ev.alpha)) h = 360 - ev.alpha;
  else if (Number.isFinite(ev.webkitCompassHeading) && ev.webkitCompassAccuracy >= 0) h = ev.webkitCompassHeading;
  else return;
  const so = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  h = (h + so + 720) % 360;
  if (HEAD.zero == null) {   /* the reading settles before the way you face is taken as north */
    const still = HEAD.prev != null && Math.abs(wrapDeg(h - HEAD.prev)) < 5;
    HEAD.prev = h;
    if (!still) return;
    HEAD.zero = h;
  }
  const want = wrapDeg(h - HEAD.zero);
  HEAD.yaw = wrapDeg(HEAD.yaw + wrapDeg(want - HEAD.yaw) * 0.2);
  const nowMs = performance.now();
  if (nowMs - HEAD.shownT > 200) {   /* the button says how far you have turned */
    HEAD.shownT = nowMs;
    el.head.textContent = "[ turned " + Math.round(((HEAD.yaw % 360) + 360) % 360) + "° ]";
  }
  if (nowMs - HEAD.lastT < 100 || !ctx || Math.abs(wrapDeg(HEAD.yaw - HEAD.aimed)) < 0.5) return;
  HEAD.lastT = nowMs; HEAD.aimed = HEAD.yaw;
  aimAll(ctx.currentTime, 0.08);
}
function engageHead() {
  const listen = () => {
    window.addEventListener("deviceorientation", onHeading);
    HEAD.on = true; HEAD.zero = null; HEAD.prev = null; HEAD.yaw = 0;
    el.head.setAttribute("aria-checked", "true");
    el.head.textContent = "[ turned 0° ]";
    if (ctx) aimAll(ctx.currentTime, 0.2);
  };
  /* ios asks first, and only from a tap */
  if (typeof DeviceOrientationEvent !== "undefined" && DeviceOrientationEvent.requestPermission)
    DeviceOrientationEvent.requestPermission()
      .then(s => { if (s === "granted") listen(); else el.head.textContent = "[ turn your head — not allowed ]"; })
      .catch(() => { el.head.textContent = "[ turn your head — no compass ]"; });
  else listen();
}
function releaseHead() {
  window.removeEventListener("deviceorientation", onHeading);
  HEAD.on = false; HEAD.yaw = 0;
  el.head.setAttribute("aria-checked", "false");
  el.head.textContent = "[ turn your head ]";
  if (ctx) aimAll(ctx.currentTime, 0.2);
}

/* ------------------------------------------------------------- UI -------- */
const el = new Proxy({}, { get: (t, k) => document.getElementById(k) });
const out = id => document.getElementById(id + "V");
function fmtHour(mins) {
  return String((mins / 60) | 0).padStart(2, "0") + ":" + String((mins % 60) | 0).padStart(2, "0");
}
function reflectHour() {
  const hm = solarHour();
  el.hour.value = Math.round(hm);
  out("hour").textContent = fmtHour(hm) + (P.lapse ? " · 24×" : "");
  lastTick = ctx ? ctx.currentTime : 0;
}
/* while the carousel turns, the hour row turns with it — the slider sweeps
   the day and the readout says the pace. begun or not, but never while a
   hand is on the thumb */
setInterval(() => { if (P.lapse && !el.hour.matches(":active")) reflectHour(); }, 400);
el.hour.addEventListener("input", () => {
  if (RIDE.on) releaseRide();
  P.now = false; P.lapse = false; lapseBase = null;
  el.now.setAttribute("aria-checked", "false"); el.lapse.setAttribute("aria-checked", "false");
  P.hour = +el.hour.value; out("hour").textContent = fmtHour(P.hour);
});
el.doy.addEventListener("input", () => {
  P.doy = +el.doy.value; out("doy").textContent = doyLabel(P.doy);
  if (site) planWeather();
});
el.now.addEventListener("click", () => {
  if (RIDE.on) releaseRide();
  const hm = solarHour();   /* before the mode flips, so time freezes in place */
  P.now = !P.now;
  if (P.now) { P.lapse = false; lapseBase = null; el.lapse.setAttribute("aria-checked", "false"); }
  else { P.hour = hm; el.hour.value = Math.round(hm); out("hour").textContent = fmtHour(hm); }
  el.now.setAttribute("aria-checked", String(P.now));
  if (P.now) reflectHour();
});
el.lapse.addEventListener("click", () => {
  if (RIDE.on) {   /* riding, the switch is the pace: the dawn's own, or twenty-four times it */
    P.lapse = !P.lapse; el.lapse.setAttribute("aria-checked", String(P.lapse));
    reflectHour(); if (site) statusLine(envNow());
    return;
  }
  const hm = solarHour();
  P.lapse = !P.lapse;
  if (P.lapse) {
    lapseBase = { real: performance.now() / 1000, hour: hm };
    P.now = false; el.now.setAttribute("aria-checked", "false");
  } else {
    lapseBase = null;   /* step off the carousel where it stands */
    P.now = false; el.now.setAttribute("aria-checked", "false");
    P.hour = hm; el.hour.value = Math.round(hm); out("hour").textContent = fmtHour(hm);
  }
  el.lapse.setAttribute("aria-checked", String(P.lapse));
});
el.today.addEventListener("click", () => {
  const d = new Date();
  P.doy = Math.max(1, Math.min(365, Math.round((d - new Date(d.getFullYear(), 0, 0)) / 86400000)));
  el.doy.value = P.doy; out("doy").textContent = doyLabel(P.doy);
  if (site) planWeather();
});
function bind(id, key, fmt, scale = 0.01) {
  el[id].addEventListener("input", () => {
    P[key] = el[id].value * scale;
    out(id).textContent = fmt(P[key]);
  });
}
const WINDWORDS = ["dead calm", "still", "light airs", "breezy", "windy", "gusty", "roaring"];
bind("density", "density", v => Math.round(v * 100));
bind("wind", "wind", v => WINDWORDS[Math.min(6, (v * 7) | 0)]);
bind("space", "space", v => { if (wetGain) wetGain.gain.value = v * 0.9; return Math.round(v * 100); });
bind("vBird", "vBird", v => Math.round(v * 100));
bind("vBug", "vBug", v => Math.round(v * 100));
bind("vFrog", "vFrog", v => Math.round(v * 100));
bind("vFauna", "vFauna", v => Math.round(v * 100));
bind("vAir", "vAir", v => Math.round(v * 100));
el.drift.addEventListener("click", () => {
  P.drift = !P.drift;
  el.drift.setAttribute("aria-checked", String(P.drift));
  if (P.drift) { engageDrift(); if (RIDE.on) releaseRide(); }
});
el.ride.addEventListener("click", () => { RIDE.on ? releaseRide() : engageRide(); });
/* the compass row only where there is a compass to turn */
if ("DeviceOrientationEvent" in window && matchMedia("(pointer: coarse)").matches) el.headRow.hidden = false;
el.head.addEventListener("click", () => { HEAD.on ? releaseHead() : engageHead(); });
el.moth.addEventListener("click", () => {
  MOTH.on = !MOTH.on;
  el.moth.setAttribute("aria-checked", String(MOTH.on));
  document.documentElement.classList.toggle("moth", MOTH.on);
  /* the blurred faders should be unreachable by keyboard too */
  ["vBird", "vFrog", "vFauna"].forEach(id => {
    const f = document.getElementById(id); if (f) f.disabled = MOTH.on;
  });
  GLOBE.fineKey = null;   /* the globe darkens with the page */
  if (running && site) { buildMothCast(); heardNames.length = 0; renderNames(); }
});
el.dub.addEventListener("click", () => {
  P.dub = !P.dub;
  el.dub.setAttribute("aria-checked", String(P.dub));
  el.dubDepthWrap.hidden = !P.dub;   /* the depth fader appears at its side */
  DUB.on = P.dub;
  if (running) P.dub ? startDub() : stopDub();
});
bind("dubDepth", "dubDepth", v => {
  if (DUB.n && P.dub && ctx) DUB.n.mix.gain.setTargetAtTime(v * 0.85, ctx.currentTime, 0.4);
  return Math.round(v * 100);
});
out("doy").textContent = doyLabel(P.doy); el.doy.value = P.doy;
out("wind").textContent = WINDWORDS[Math.min(6, (P.wind * 7) | 0)];

el.jump.addEventListener("click", randomSite);
el.sleep.addEventListener("click", () => {
  if (SLEEP.asleep) { wake(); return; }
  const i = SLEEP_STEPS.indexOf(SLEEP.min);
  SLEEP.min = SLEEP_STEPS[(i + 1) % SLEEP_STEPS.length];
  SLEEP.endT = performance.now() + SLEEP.min * 60000;
  if (master && ctx) master.gain.setTargetAtTime(0.9, ctx.currentTime, 0.5);   /* a fade underway lets go */
  reflectSleep();
});
el.share.addEventListener("click", async () => {
  if (!site) return;
  const u = location.origin + location.pathname
    + `?lat=${site.lat.toFixed(2)}&lon=${site.lon.toFixed(2)}&day=${dayStr}`;
  try { await navigator.clipboard.writeText(u); el.share.textContent = "[ copied ]"; }
  catch { el.share.textContent = "[ " + u + " ]"; }
  setTimeout(() => el.share.textContent = "[ share this place ]", 2500);
});

/* ------------------------------------------------------------ begin ------ */
el.begin.addEventListener("click", async () => {
  if (running) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  SR = ctx.sampleRate;
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch {}
  await ctx.resume();
  ctx.onstatechange = () => { if (ctx.state !== "running" && !document.hidden && !SLEEP.asleep) ctx.resume(); };
  document.addEventListener("touchend", () => {
    if (ctx && ctx.state !== "running" && !SLEEP.asleep) ctx.resume();
  }, { passive: true });
  holdScreen();
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    if (ctx && ctx.state !== "running" && !SLEEP.asleep) ctx.resume();
    holdScreen();
  });

  comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 2.5; comp.attack.value = 0.012; comp.release.value = 0.25;
  master = ctx.createGain(); master.gain.value = 0.9;
  comp.connect(master); master.connect(ctx.destination);
  /* the mix is LINEAR at `sum` (stems sum back exactly, album convention);
     the compressor after it only guards live playback */
  sum = ctx.createGain(); sum.connect(comp);
  space = ctx.createGain(); space.connect(sum);
  wetGain = ctx.createGain(); wetGain.gain.value = P.space * 0.9;
  for (const gname of ["bird", "bug", "frog", "fauna", "air"]) {
    const dry = ctx.createGain(), wet = ctx.createGain();
    dry.gain.value = 0.85; wet.gain.value = 1;
    dry.connect(sum); wet.connect(wetGain);
    groups[gname] = { dry, wet };
  }
  if (!site) randomSite();
  conv = ctx.createConvolver();
  conv.buffer = makeIR(BIOME_INFO[site.biome].family);
  wetGain.connect(conv); conv.connect(space);
  /* discrete echo (canyons, lake loons) */
  echoNode = ctx.createDelay(3); echoNode.delayTime.value = site.rocky ? 1.1 : 1.5;
  const efb = ctx.createGain(); efb.gain.value = 0.3;
  const elp = ctx.createBiquadFilter(); elp.type = "lowpass"; elp.frequency.value = 2100;
  echoGain = ctx.createGain(); echoGain.gain.value = 0.35;
  echoNode.connect(elp); elp.connect(efb); efb.connect(echoNode);
  elp.connect(echoGain); echoGain.connect(space);

  running = true;
  buildSynth();
  buildBed(); buildWaterEvents(); buildCast(); buildMothCast();
  if (P.dub) { DUB.on = true; startDub(); }
  el.begin.remove();
  reflectHour();
  tick(); drawMap();
});

/* ------------------------------------------------- url site + initial ---- */
(() => {
  const qlat = parseFloat(params.get("lat")), qlon = parseFloat(params.get("lon"));
  requestAnimationFrame(() => { drawMap();
    if (!isNaN(qlat) && !isNaN(qlon)) { setSite(qlon, qlat);
      if (site) globeCenter(site.lon, site.lat); } });
  const qh = parseFloat(params.get("h"));
  if (!isNaN(qh)) { P.now = false; P.hour = qh * 60;
    el.now.setAttribute("aria-checked", "false");
    el.hour.value = P.hour; out("hour").textContent = fmtHour(P.hour); }
  /* the compass only speaks to a secure page */
  if (location.protocol === "http:" && !/^(localhost|127\.)/.test(location.hostname))
    location.replace("https://" + location.host + location.pathname + location.search);
  /* installable, and fully offline after the first visit */
  if ("serviceWorker" in navigator && location.protocol !== "file:")
    navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
