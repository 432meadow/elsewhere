<meta charset="utf-8">
<title>elsewhere</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  /* the immanence look: near-black, white, one gray — two accents: sun & night */
  :root {
    --bg: #121212;
    --s1: #ffffff;        /* primary ink */
    --s2: #84858c;        /* secondary ink */
    --s3: #4a4b52;        /* dim ink */
    --rule: #2e2e33;
    --focus: #ffffff;
    --warm: #a08558;       /* day, birds */
    --cool: #6e8494;       /* night, water */
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #fafafa; --s1: #121212; --s2: #85858c; --s3: #b9b9bf;
      --rule: #e4e4e6; --focus: #121212;
      --warm: #8a6f42; --cool: #5b7484;
    }
  }
  :root[data-theme="light"] {
    --bg: #fafafa; --s1: #121212; --s2: #85858c; --s3: #b9b9bf;
    --rule: #e4e4e6; --focus: #121212;
    --warm: #8a6f42; --cool: #5b7484;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--s1);
    font-family: Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 1.5; font-weight: 400;
  }
  .row { border-bottom: 1px solid var(--rule); padding: 14px 16px; }
  .row.head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 16px; font-weight: 400; margin: 0; }
  .g { color: var(--s2); }

  #stage { position: relative; border-bottom: 1px solid var(--rule); }
  #map { display: block; width: 100%; height: 380px; cursor: crosshair; touch-action: manipulation; }
  #begin {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: transparent; border: 0; cursor: pointer; color: var(--s1);
    font: inherit; letter-spacing: 0.02em;
  }
  #begin:hover { color: var(--s2); }
  #begin:focus-visible { outline: 1px solid var(--focus); outline-offset: -8px; }

  #siteline {
    padding: 10px 16px; border-bottom: 1px solid var(--rule); font-size: 13px;
    color: var(--s2); font-variant-numeric: tabular-nums; min-height: 40px;
  }
  #siteline b { color: var(--warm); font-weight: 400; }
  #voicesline {
    padding: 10px 16px; border-bottom: 1px solid var(--rule); font-size: 13px;
    color: var(--s3); min-height: 40px; font-style: italic;
  }
  #voicesline span { transition: opacity 3s; }

  .sect { padding: 14px 16px 4px; color: var(--s2); font-size: 13px;
          border-bottom: 1px solid var(--rule); }
  .ctl { display: block; border-bottom: 1px solid var(--rule); padding: 12px 16px 16px; }
  .ctl .row2 { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .ctl label { font-size: 16px; }
  .ctl output { font-size: 14px; color: var(--s2); font-variant-numeric: tabular-nums; }
  .ctl.warm output { color: var(--warm); }
  .ctl.cool output { color: var(--cool); }
  .ctl.warm input[type="range"]::-webkit-slider-thumb { background: var(--warm); }
  .ctl.cool input[type="range"]::-webkit-slider-thumb { background: var(--cool); }
  .ctl.warm input[type="range"]::-moz-range-thumb { background: var(--warm); }
  .ctl.cool input[type="range"]::-moz-range-thumb { background: var(--cool); }

  input[type="range"] {
    appearance: none; -webkit-appearance: none; width: 100%; height: 18px;
    background: transparent; cursor: pointer; margin: 0; display: block;
  }
  input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--rule); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%;
    background: var(--s1); margin-top: -5px; border: 0;
  }
  input[type="range"]::-moz-range-track { height: 1px; background: var(--rule); }
  input[type="range"]::-moz-range-thumb {
    width: 11px; height: 11px; border-radius: 50%; background: var(--s1); border: 0;
  }
  input[type="range"]:focus-visible { outline: 1px solid var(--focus); outline-offset: 4px; }

  .seg { display: flex; gap: 18px; flex-wrap: wrap; }
  .seg button, .act, .switch {
    background: transparent; border: 0; padding: 0; font: inherit; cursor: pointer;
    color: var(--s2); touch-action: manipulation;
  }
  .seg button[aria-pressed="true"] { color: var(--s1); }
  .seg button:hover, .act:hover, .switch:hover { color: var(--s1); }
  .act:hover { color: var(--warm); }
  .act[disabled] { color: var(--s3); cursor: default; }
  .switch[aria-checked="true"] { color: var(--s1); }
  .seg button:focus-visible, .act:focus-visible, .switch:focus-visible {
    outline: 1px solid var(--focus); outline-offset: 4px;
  }
  .inline { display: flex; gap: 24px; align-items: baseline; flex-wrap: wrap;
            border-bottom: 1px solid var(--rule); padding: 14px 16px; }
  .inline.between { justify-content: space-between; }

  @media (pointer: coarse) {
    input[type="range"] { height: 32px; }
    input[type="range"]::-webkit-slider-thumb { width: 20px; height: 20px; margin-top: -9.5px; }
    input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; }
    .seg button, .act, .switch { padding: 6px 0; }
  }
  @media (max-width: 480px) {
    #map { height: 260px; }
    .row.head { flex-direction: column; gap: 4px; }
  }
</style>

<div class="row head">
  <h1>[ elsewhere ]</h1>
  <span class="g">every place is singing</span>
</div>

<div id="stage">
  <canvas id="map" width="1024" height="380"></canvas>
  <button id="begin">[ begin ]</button>
</div>
<div id="siteline">click the map to listen somewhere</div>
<div id="voicesline"></div>

<div class="sect">when</div>
<div class="inline between">
  <div class="seg">
    <button class="switch" id="now" role="switch" aria-checked="true"
      aria-label="Follow the actual time at the site">[ now ]</button>
    <button class="switch" id="lapse" role="switch" aria-checked="false"
      aria-label="Time-lapse: a day passes in an hour">[ a day in an hour ]</button>
  </div>
  <button class="act" id="today" aria-label="Set the season to today">[ today ]</button>
</div>
<div class="ctl warm">
  <div class="row2"><label for="hour">hour</label><output id="hourV">--:--</output></div>
  <input type="range" id="hour" min="0" max="1439" step="5" value="360"
         aria-label="Local solar time at the site">
</div>
<div class="ctl cool">
  <div class="row2"><label for="doy">season</label><output id="doyV">—</output></div>
  <input type="range" id="doy" min="1" max="365" step="1" value="160"
         aria-label="Day of the year">
</div>

<div class="sect">listening</div>
<div class="ctl"><div class="row2"><label for="density">density</label><output id="densityV">60</output></div>
  <input type="range" id="density" min="0" max="100" value="60" aria-label="How many voices"></div>
<div class="ctl"><div class="row2"><label for="wind">wind</label><output id="windV">drifting</output></div>
  <input type="range" id="wind" min="0" max="100" value="35" aria-label="Wind strength"></div>
<div class="ctl"><div class="row2"><label for="space">space</label><output id="spaceV">40</output></div>
  <input type="range" id="space" min="0" max="100" value="40" aria-label="Openness of the air"></div>

<div class="sect">voices</div>
<div class="ctl warm"><div class="row2"><label for="vBird">birds</label><output id="vBirdV">70</output></div>
  <input type="range" id="vBird" min="0" max="100" value="70" aria-label="Bird level"></div>
<div class="ctl"><div class="row2"><label for="vBug">insects</label><output id="vBugV">70</output></div>
  <input type="range" id="vBug" min="0" max="100" value="70" aria-label="Insect level"></div>
<div class="ctl cool"><div class="row2"><label for="vFrog">frogs</label><output id="vFrogV">70</output></div>
  <input type="range" id="vFrog" min="0" max="100" value="70" aria-label="Frog level"></div>
<div class="ctl cool"><div class="row2"><label for="vFauna">fauna</label><output id="vFaunaV">70</output></div>
  <input type="range" id="vFauna" min="0" max="100" value="70" aria-label="Mammal and beast level"></div>
<div class="ctl"><div class="row2"><label for="vAir">air &amp; water</label><output id="vAirV">70</output></div>
  <input type="range" id="vAir" min="0" max="100" value="70" aria-label="Wind and water level"></div>

<div class="inline">
  <button class="switch" id="drift" role="switch" aria-checked="false"
    aria-label="Drift: the listener wanders the land">[ &infin; drift ]</button>
  <span class="g">the listener wanders the land</span>
</div>
<div class="inline between">
  <div class="seg">
    <button class="act" id="jump" aria-label="Go somewhere else at random">[ elsewhere ]</button>
    <button class="act" id="keep" aria-label="Download the last 90 seconds as WAV">[ keep .wav ]</button>
    <button class="act" id="stems" aria-label="Download the last 90 seconds as separate stems">[ keep stems ]</button>
    <span class="g">the last 90 seconds</span>
  </div>
  <button class="act" id="share" aria-label="Copy a link to this site and day">[ share this place ]</button>
</div>

function envNow() {
  const hm = solarHour(), hour = hm / 60;
  const el = site ? sunElevation(site.lat, P.doy, hour) : 0;
  const rising = hour < 12.5;
  const tF = site ? tempF(site, P.doy, hour) : 60;
  /* phase weights, all 0..1 and overlapping a little */
  const dawn = rising ? gauss(el, 0, 7) * (el > -12 ? 1 : 0) : 0;
  const dusk = !rising ? gauss(el, -1, 6) * (el > -14 ? 1 : 0) : 0;
  const day = smooth((el - 4) / 8);
  const night = smooth((-el - 8) / 6);
  const twilight = Math.max(dawn, dusk);
  return { hour, el, rising, tF, doy: P.doy, dawn, dusk, day, night, twilight,
           gust: (typeof bed !== "undefined" && bed) ? bed.gust : 0.3 };
}
function gauss(x, mu, sig) { const d = (x - mu) / sig; return Math.exp(-d * d / 2); }
function smooth(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }
function inDoy(doy, a, b) { return a <= b ? doy >= a && doy <= b : doy >= a || doy <= b; }

/* =============================================================== dsp ===== */
let ctx = null, SR = 44100;
const ru = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(ru(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* in-place one-pole filters + biquad bandpass on Float32Array */
function lpA(x, fc) { const a = Math.exp(-2 * Math.PI * fc / SR); let y = 0;
  for (let i = 0; i < x.length; i++) { y = a * y + (1 - a) * x[i]; x[i] = y; } return x; }
function hpA(x, fc) { const a = Math.exp(-2 * Math.PI * fc / SR); let lp = 0;
  for (let i = 0; i < x.length; i++) { lp = a * lp + (1 - a) * x[i]; x[i] = x[i] - lp; } return x; }
function bpA(x, fc, q) {
  const w = 2 * Math.PI * Math.min(fc, SR * 0.45) / SR, al = Math.sin(w) / (2 * q),
        b0 = al, b2 = -al, a0 = 1 + al, a1 = -2 * Math.cos(w), a2 = 1 - al;
  const y = new Float32Array(x.length); let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
  for (let i = 0; i < x.length; i++) { const v = (b0 * x[i] + b2 * x2 - a1 * y1 - a2 * y2) / a0;
    x2 = x1; x1 = x[i]; y2 = y1; y1 = v; y[i] = v; }
  return y;
}
function noiseA(n) { const x = new Float32Array(n);
  for (let i = 0; i < n; i++) x[i] = Math.random() * 2 - 1; return x; }
function normA(x, peak = 1) { let m = 0;
  for (let i = 0; i < x.length; i++) m = Math.max(m, Math.abs(x[i]));
  if (m > 0) { const g = peak / m; for (let i = 0; i < x.length; i++) x[i] *= g; } return x; }
function scaleA(x, g) { for (let i = 0; i < x.length; i++) x[i] *= g; return x; }
function addTo(dst, src, at = 0) { const n = Math.min(dst.length - at, src.length);
  for (let i = 0; i < n; i++) dst[at + i] += src[i]; return dst; }
function env3(x, atk, rel, decay = 0) { const n = x.length;
  const na = Math.max(1, (atk * SR) | 0), nr = Math.max(1, (rel * SR) | 0);
  for (let i = 0; i < Math.min(na, n); i++) x[i] *= i / na;
  for (let i = 0; i < Math.min(nr, n); i++) x[n - 1 - i] *= i / nr;
  if (decay) for (let i = 0; i < n; i++) x[i] *= 1 - decay * (i / n);
  return x; }
function gapN(d) { return new Float32Array(Math.max(1, (d * SR) | 0)); }
function cat(...parts) { let n = 0; for (const p of parts) n += p.length;
  const x = new Float32Array(n); let at = 0;
  for (const p of parts) { x.set(p, at); at += p.length; } return x; }

/* the bird-note primitive: a whistle following a pitch contour (tone() port) */
function tone(dur, pts, o = {}) {
  const n = Math.max(8, (dur * SR) | 0), x = new Float32Array(n);
  const harm = o.harm || [1, 0.12];
  let hsum = 0; for (const a of harm) hsum += a;
  const vibR = o.vib ? o.vib[0] : 0, vibC = o.vib ? o.vib[1] : 0;
  let ph = 0, seg = 0, fsum = 0;
  for (let i = 0; i < n; i++) {
    const tf = i / n;
    while (seg < pts.length - 2 && tf > pts[seg + 1][0]) seg++;
    const [t0, f0] = pts[seg], [t1, f1] = pts[seg + 1];
    let f = f0 + (f1 - f0) * Math.max(0, Math.min(1, (tf - t0) / Math.max(1e-6, t1 - t0)));
    if (vibR) f *= Math.pow(2, vibC / 1200 * Math.sin(2 * Math.PI * vibR * i / SR));
    fsum += f; ph += 2 * Math.PI * f / SR;
    let s = 0;
    for (let k = 0; k < harm.length; k++) s += harm[k] * Math.sin((k + 1) * ph);
    x[i] = s / hsum;
  }
  if (o.noise) {
    const fm = fsum / n;
    const nz = normA(bpA(noiseA(n), o.nfc || fm * 1.4, o.nq || 1.2));
    for (let i = 0; i < n; i++) x[i] = x[i] * (1 - o.noise) + nz[i] * o.noise;
  }
  return env3(x, o.atk ?? 0.006, o.rel ?? 0.03, o.decay ?? 0.25);
}
/* a noisy rasp/buzz: bandpassed noise, optional AM, sine-window */
function rasp(dur, fc, q, o = {}) {
  const n = Math.max(8, (dur * SR) | 0);
  const x = bpA(noiseA(n), fc, q ?? 1);
  if (o.am) { const d = o.amd ?? 1, ph = ru(0, 6.28);
    for (let i = 0; i < n; i++)
      x[i] *= Math.pow(0.5 + 0.5 * Math.sin(2 * Math.PI * o.am * i / SR + ph), d); }
  for (let i = 0; i < n; i++) x[i] *= Math.pow(Math.sin(Math.PI * i / n), o.win ?? 0.7);
  return normA(x);
}
/* a train of short pulses (rattles, drums, clatter);
   accel > 1 : the train slows down, < 1 : it speeds up */
function pulses(count, rate, mk, o = {}) {
  const accel = o.accel ?? 1, jit = o.jit ?? 0.05;
  const parts = [];
  for (let k = 0; k < count; k++) {
    const pulse = mk(k); parts.push(pulse);
    const per = (1 / rate) * Math.pow(accel, k / Math.max(1, count - 1));
    parts.push(gapN(Math.max(0.001, per * (1 + ru(-jit, jit)) - pulse.length / SR)));
  }
  return cat(...parts);
}

/* ========================================================== species ====== */
const SP = {};
function def(id, o) { SP[id] = { id, ...o }; }
const A = o => e => {
  if (o.doy && !inDoy(e.doy, o.doy[0], o.doy[1])) return 0;
  if (o.tMin != null && e.tF < o.tMin) return 0;
  if (o.tMax != null && e.tF > o.tMax) return 0;
  if (o.sunMax != null && e.el > o.sunMax) return 0;   /* nightjars stop at sunrise */
  const v = (o.dawn || 0) * e.dawn + (o.day || 0) * e.day
          + (o.dusk || 0) * e.dusk + (o.night || 0) * e.night;
  return Math.min(1, v);
};

/* ------------------------------------------------------- birds: east ----- */
def("robin", { name: "american robin", g: "bird",
  act: A({ doy: [60, 210], dawn: 1.6, day: 0.25, dusk: 0.8 }), gap: [3, 8], dist: [0.15, 0.6], n: [1, 2],
  gen() { const parts = [];
    for (let k = 0, m = ri(2, 4); k < m; k++) {
      const f0 = ru(2000, 2800), arc = pick([1, -1]);
      parts.push(tone(ru(0.18, 0.3), [[0, f0], [0.4, f0 * (1 + arc * 0.18)], [1, f0 * (1 - arc * 0.08)]],
        { harm: [1, 0.18, 0.05], vib: [ru(18, 30), 30], atk: 0.01, rel: 0.05 }));
      parts.push(gapN(ru(0.06, 0.16)));
    } return cat(...parts); } });

def("woodthrush", { name: "wood thrush", g: "bird",
  act: A({ doy: [125, 205], dawn: 1.5, day: 0.12, dusk: 1.3 }), gap: [4, 9], dist: [0.2, 0.6], n: [1, 1], rev: 0.4,
  gen() { const f = ru(2100, 2600);
    const intro = tone(0.12, [[0, 1150], [1, 1250]], { harm: [1, 0.2], atk: 0.02, rel: 0.04 });
    scaleA(intro, 0.35);
    const parts = [intro, gapN(0.05)];
    for (let k = 0, m = ri(3, 5); k < m; k++) {
      const fk = f * pick([1, 1.22, 0.84, 1.5]);
      parts.push(tone(ru(0.12, 0.2), [[0, fk], [1, fk * ru(0.95, 1.06)]],
        { harm: [1, 0.35, 0.06], atk: 0.008, rel: 0.03 }));
      parts.push(gapN(ru(0.03, 0.07)));
    }
    /* terminal bichordal trill: two detuned fast voices */
    const td = ru(0.35, 0.5), n = (td * SR) | 0, tr = new Float32Array(n);
    const fa = ru(4200, 5200), fb = fa * ru(1.06, 1.12);
    let pa = 0, pb = 0;
    for (let i = 0; i < n; i++) {
      const am = Math.pow(0.5 + 0.5 * Math.sin(2 * Math.PI * 42 * i / SR), 1.2);
      pa += 2 * Math.PI * fa / SR; pb += 2 * Math.PI * fb / SR;
      tr[i] = (Math.sin(pa) + Math.sin(pb)) * 0.5 * am;
    }
    parts.push(env3(tr, 0.01, 0.06)); return cat(...parts); } });

def("hermitthrush", { name: "hermit thrush", g: "bird",
  act: A({ doy: [140, 225], dawn: 1.4, day: 0.08, dusk: 1.5 }), gap: [6, 11], dist: [0.25, 0.7], n: [1, 1], rev: 0.45,
  gen() { const f0 = pick([2600, 3100, 3700, 4300]) * ru(0.97, 1.03);
    const parts = [tone(ru(0.35, 0.5), [[0, f0], [1, f0 * 1.005]],
      { harm: [1, 0.08], atk: 0.03, rel: 0.05, decay: 0.15 }), gapN(0.05)];
    let f = f0;
    for (let k = 0, m = ri(5, 8); k < m; k++) {
      f *= pick([1.19, 1.33, 0.9, 1.12]);
      f = Math.min(Math.max(f, 2200), 7800);
      parts.push(tone(ru(0.05, 0.09), [[0, f], [1, f * ru(0.94, 1.1)]],
        { harm: [1, 0.15], atk: 0.004, rel: 0.02 }));
      parts.push(gapN(ru(0.015, 0.04)));
    } return cat(...parts); } });

def("veery", { name: "veery", g: "bird",
  act: A({ doy: [140, 200], dawn: 0.7, dusk: 1.5, day: 0.05 }), gap: [6, 12], dist: [0.3, 0.7], n: [1, 1], rev: 0.4,
  gen() { const parts = []; let f = ru(3800, 4400);
    for (let k = 0, m = ri(4, 5); k < m; k++) {
      const n = (ru(0.28, 0.36) * SR) | 0, x = new Float32Array(n);
      let pa = 0, pb = 0;
      for (let i = 0; i < n; i++) {
        const tf = i / n, fk = f * (1 - 0.22 * tf) * (1 + 0.04 * Math.sin(2 * Math.PI * 24 * i / SR));
        pa += 2 * Math.PI * fk / SR; pb += 2 * Math.PI * fk * 1.03 / SR;
        x[i] = (Math.sin(pa) + 0.7 * Math.sin(pb)) / 1.7;
      }
      parts.push(env3(x, 0.01, 0.04)); parts.push(gapN(0.02));
      f *= 0.84;
    } return cat(...parts); } });

def("vthrush", { name: "varied thrush", g: "bird",
  act: A({ doy: [65, 200], dawn: 1.3, day: 0.35, dusk: 1.2 }), gap: [5, 10], dist: [0.25, 0.7], n: [1, 2], rev: 0.45,
  gen() { const f = pick([2600, 3000, 3400, 3900]) * ru(0.98, 1.02);
    const n = (ru(1.1, 1.7) * SR) | 0, x = new Float32Array(n);
    let pa = 0, pb = 0;
    for (let i = 0; i < n; i++) {
      pa += 2 * Math.PI * f / SR; pb += 2 * Math.PI * f * 1.017 / SR;
      x[i] = (Math.sin(pa) + 0.8 * Math.sin(pb) + 0.12 * Math.sin(2 * pa)) / 1.9;
    }
    const nz = scaleA(normA(bpA(noiseA(n), f * 1.2, 2)), 0.1);
    addTo(x, nz);
    return env3(x, 0.05, 0.15, 0.1); } });

function drumRoll(strikes, rate, fc, decel = 1) {
  const mk = () => { const x = noiseA((0.006 * SR) | 0);
    for (let i = 0; i < x.length; i++) x[i] *= Math.exp(-i / (SR * 0.0018));
    return bpA(x, fc, 1.1); };
  return pulses(strikes, rate, mk, { accel: decel, jit: 0.03 });
}

def("geese", { name: "canada geese overhead", g: "bird",
  act: A({ doy: [1, 365], dawn: 0.7, day: 0.5, dusk: 0.7 }), gap: [90, 240], dist: [0.5, 0.8], n: [1, 1], pass: 22,
  gen() { const dur = 20, n = (dur * SR) | 0, x = new Float32Array(n);
    for (let v = 0, nv = ri(4, 9); v < nv; v++) {
      const b = ru(420, 620); let t = ru(0, 2.5);
      while (t < dur - 0.5) {
        const hn = cat(
          tone(0.1, [[0, b * 0.8], [1, b * 0.85]], { harm: [1, 0.8, 0.5, 0.2], noise: 0.15, atk: 0.01, rel: 0.02 }),

/* =========================================================== insects ===== */
function cricketChirpBuf(f, npulse, pulseDur, pulsePer) {
  const dur = npulse * pulsePer + 0.02, n = (dur * SR) | 0, x = new Float32Array(n);
  for (let k = 0; k < npulse; k++) {
    const s = (k * pulsePer * (1 + ru(-0.04, 0.04)) * SR) | 0;
    const L = (pulseDur * SR) | 0;
    for (let i = 0; i < L && s + i < n; i++) {
      const t = i / SR;
      x[s + i] += (Math.sin(2 * Math.PI * f * t) + 0.08 * Math.sin(4 * Math.PI * f * t)
                 + 0.09 * (Math.random() * 2 - 1)) * Math.exp(-t / (pulseDur * 0.32));
    }
  }
  return x;
}
def("fcricket", { name: "field crickets", g: "bug",
  act: A({ doy: [130, 300], tMin: 51, night: 1, dusk: 1, dawn: 0.4, day: 0.15 }),
  gap: [0.4, 1.2], dist: [0.1, 0.8], n: [3, 6],
  gen(e) { const rate = Math.max(0.4, Math.min(3, (e.tF - 40) / 14));   /* dolbear */
    this._gap = [0.5 / rate, 1.6 / rate];
    return cricketChirpBuf(ru(3900, 5200), ri(3, 5), ru(0.014, 0.02), ru(0.02, 0.032)); } });
def("treecricket", { name: "snowy tree cricket", g: "bug",
  act: A({ doy: [185, 290], tMin: 55, night: 1, dusk: 1.1, dawn: 0.3 }),
  gap: [0.1, 0.3], dist: [0.25, 0.7], n: [2, 4],
  gen(e) { const wing = Math.max(20, 0.75 * e.tF - 12);        /* AM rate tracks temp */
    const dur = ru(0.5, 0.9), n = (dur * SR) | 0, x = new Float32Array(n);
    const f = ru(2500, 3100); let ph = 0;
    for (let i = 0; i < n; i++) {
      const am = Math.pow(0.5 + 0.5 * Math.sin(2 * Math.PI * wing * i / SR), 1.6);
      ph += 2 * Math.PI * f / SR;
      x[i] = (Math.sin(ph) + 0.1 * Math.sin(2 * ph)) * am;
    } return env3(x, 0.02, 0.04); } });

def("cicada_dd", { name: "dog-day cicada", g: "bug",
  act: A({ doy: [195, 265], tMin: 74, day: 1.2 }), gap: [8, 25], dist: [0.25, 0.7], n: [1, 3],
  gen() { const dur = ru(9, 15), n = (dur * SR) | 0;
    let x = bpA(noiseA(n), 7000, 6);
    const x2 = bpA(noiseA(n), 7900, 8);
    for (let i = 0; i < n; i++) {
      const tf = i / n;
      const swell = Math.pow(Math.sin(Math.PI * Math.min(1, tf * 1.15)), 0.6);
      const grit = 1 - 0.25 * Math.pow(0.5 + 0.5 * Math.sin(2 * Math.PI * 88 * i / SR), 2);
      x[i] = (x[i] * 3 + x2[i] * 1.6) * swell * grit;
    } return normA(x); } });
def("cicada_sg", { name: "scissor-grinder cicada", g: "bug",
  act: A({ doy: [190, 265], tMin: 72, day: 0.5, dusk: 1.2 }), gap: [10, 25], dist: [0.3, 0.7], n: [1, 2],
  gen() { const dur = ru(8, 13), n = (dur * SR) | 0;
    const x = bpA(noiseA(n), 4800, 4);

function chorusBuf(dur, nVoices, mkVoice) {
  const n = (dur * SR) | 0, x = new Float32Array(n);
  for (let v = 0; v < nVoices; v++) {
    const call = mkVoice(), per = call.per, cx = call.x, g = ru(0.3, 1);
    let t = ru(0, per);
    while (t < dur - cx.length / SR) {
      addTo(x, scaleA(cx.slice(), g), (t * SR) | 0);
      t += per * ru(0.9, 1.15);
    }
  }
  return normA(x);
}

/* ============================================================ engine ===== */
let running = false, wetGain, echoNode, echoGain, comp, master, conv = null;
let sum = null, space = null;   /* linear pre-comp mix bus + the reverb/echo return */
const groups = {};          /* bird/bug/frog/fauna/air -> {dry, wet} */
const GROUP_OF = { bird: "bird", bug: "bug", frog: "frog", beast: "fauna", air: "air" };
const FADER_OF = { bird: "vBird", bug: "vBug", frog: "vFrog", fauna: "vFauna", air: "vAir" };
let arng = Math.random;     /* scheduling rng, reseeded per site+day */
let wrng = Math.random;     /* weather rng */

function makeIR(family) {
  const specs = { forest: [1.4, 3400, 0.55], open: [1.9, 4200, 0.3],
                  canyon: [2.2, 3000, 0.5], beach: [0.7, 3800, 0.2], snow: [0.6, 2200, 0.25] };
  const [t60, lp, early] = specs[family] || specs.open;
  const n = (SR * Math.min(3, t60 * 1.4)) | 0, ir = ctx.createBuffer(2, n, SR);
  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c); let y = 0;
    const a = Math.exp(-2 * Math.PI * lp / SR);
    for (let i = 0; i < n; i++) {
      const t = i / SR;
      const nz = (Math.random() * 2 - 1) * Math.pow(10, -3 * t / t60) * Math.min(1, t / 0.02 + early * 0.3);
      y = a * y + (1 - a) * nz; d[i] = y * 3;
    }
  }
  return ir;
}

function mkbuf(x) { const b = ctx.createBuffer(1, x.length, SR); b.copyToChannel(x, 0); return b; }

const visEvents = [];
function play(x, when, o = {}) {
  /* o: dist 0..1, pan -1..1, gain, group, name, rev, echo, omni, fog */
  if (!running || !x || !x.length) return 0;
  const dist = o.dist ?? 0.5;
  const fog = o.fog ?? weather.fog;
  let fc = 11000 * Math.pow(2, -dist * 3.1);
  fc *= 1 - 0.45 * fog;
  const amp = (o.gain ?? 1) * Math.pow(1 - 0.82 * dist, 1.5);
  const src = ctx.createBufferSource(); src.buffer = mkbuf(x);
  src.playbackRate.value = Math.pow(2, ru(-4, 4) / 1200);
  const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = Math.max(300, fc); lp.Q.value = 0.4;
  const g = ctx.createGain(); g.gain.value = amp;
  const pan = ctx.createStereoPanner(); pan.pan.value = o.omni ? 0 : (o.pan ?? 0) * (1 - 0.45 * dist);
  src.connect(lp); lp.connect(g); g.connect(pan);
  const grp = groups[o.group || "air"];
  pan.connect(grp.dry);
  const wet = ctx.createGain();
  wet.gain.value = (o.rev ?? 0.15) + 0.55 * dist;
  pan.connect(wet); wet.connect(grp.wet);
  if (o.echo) { const eg = ctx.createGain(); eg.gain.value = 0.5; pan.connect(eg); eg.connect(echoNode); }
  src.start(when);
  const durS = x.length / SR;
  src.stop(when + durS + 0.1);
  if (o.name) visEvents.push({ t: when, name: o.name, pan: o.pan ?? 0, dist, dur: durS });
  return durS;
}

/* ------------------------------------------------------------- beds ------ */
/* continuous atmosphere: a looping noise source through parallel taps whose
   gains/filters the tick steers (gusts, rain, surf swell). event-shaped
   water (waves, laps, bubbles) is rendered buffers on the scheduler. */
let bed = null;
function noiseLoopSrc() {
  const n = SR * 4, b = ctx.createBuffer(2, n, SR);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; }
  const s = ctx.createBufferSource(); s.buffer = b; s.loop = true; s.start();
  return s;
}
function tap(src, type, freq, q, gain, dest) {
  const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ctx.createGain(); g.gain.value = gain;
  src.connect(f); f.connect(g); g.connect(dest);
  return { f, g };
}
function buildBed() {
  if (bed) {   /* let the old country fade behind us */
    const old = bed, now = ctx.currentTime;
    old.out.gain.setTargetAtTime(0, now, 0.9);
    old.outWet.gain.setTargetAtTime(0, now, 0.9);
    try { old.src.stop(now + 4.5); } catch (e) {}
    setTimeout(() => { for (const n of old.nodes) { try { n.disconnect(); } catch (e) {} }
      try { old.out.disconnect(); old.outWet.disconnect(); } catch (e) {} }, 5000);
  }
  const out = ctx.createGain(), outWet = ctx.createGain();
  out.gain.value = 0; outWet.gain.value = 0;
  out.connect(groups.air.dry); outWet.connect(groups.air.wet);
  out.gain.setTargetAtTime(1, ctx.currentTime + 0.05, 1.1);
  outWet.gain.setTargetAtTime(1, ctx.currentTime + 0.05, 1.1);
  const dest = out, wet = outWet;
  const src = noiseLoopSrc();
  const nodes = [src];
  const t = {};
  /* vegetation band per biome: [freq, q, base gain] */
  const veg = { efor: [2400, 0.6, 0.5], bor: [700, 0.7, 0.45], sepine: [1000, 0.8, 0.4],
                flwet: [3000, 0.7, 0.35], tgrass: [5200, 0.6, 0.5], sgrass: [4800, 0.7, 0.4],
                son: [1800, 1.2, 0.2], chih: [3600, 0.9, 0.25], sage: [900, 0.8, 0.35],
                mont: [600, 0.7, 0.55], pnw: [500, 0.7, 0.55], cal: [3400, 0.7, 0.4],
                acoast: [4400, 0.8, 0.4], pcoast: [1200, 0.8, 0.4] }[site.biome];
  t.low = tap(src, "lowpass", 130, 0.5, 0.02, dest);        /* air floor */
  t.moan = tap(src, "bandpass", 240, 1.2, 0.0, dest);       /* wind body */
  t.veg = tap(src, "bandpass", veg[0], veg[1], 0.0, dest);  /* vegetation */
  t.hiss = tap(src, "highpass", 5200, 0.5, 0.0, dest);      /* grass/needle hiss */
  t.vegWet = ctx.createGain(); t.vegWet.gain.value = 0.15;
  t.veg.g.connect(t.vegWet); t.vegWet.connect(wet);
  /* water washes */
  if (site.water.stream) {
    t.st1 = tap(src, "bandpass", 700, 1.4, 0.014, dest);
    t.st2 = tap(src, "bandpass", 1900, 1.6, 0.01, dest);
    t.st3 = tap(src, "bandpass", 3600, 2, 0.006, dest);
  }
  if (site.water.surf || site.water.lakeSurf) {
    t.rumble = tap(src, "lowpass", 190, 0.6, 0.05, dest);
    t.swash = tap(src, "bandpass", 1100, 0.7, 0.0, dest);
  }
  t.rain = tap(src, "bandpass", 3800, 0.5, 0.0, dest);      /* rain hiss */
  bed = { src, nodes, t, veg, out, outWet, gust: bed ? bed.gust : 0.3, gustV: 0 };
}
/* per-tick bed steering: one random-walk gust shared by all wind taps */
function steerBed(now) {
  if (!bed) return;
  const wState = weather.wind * (0.5 + P.wind);             /* 0..~1.5 */
  bed.gustV += (arng() - 0.5) * 0.14 + (wState * 0.55 - bed.gust) * 0.05;
  bed.gustV *= 0.86;
  bed.gust = Math.max(0.02, Math.min(1.4, bed.gust + bed.gustV));
  const g = bed.gust, T = 0.4, t = bed.t, vAir = P.vAir;
  const set = (p, v) => p.setTargetAtTime(v * vAir, now, T);
  set(t.moan.g.gain, 0.05 * g * g);
  set(t.veg.g.gain, bed.veg[2] * 0.09 * Math.pow(g, 1.6));
  t.veg.f.frequency.setTargetAtTime(bed.veg[0] * (1 + 0.35 * g), now, T);
  const grassy = ["tgrass", "sgrass", "acoast", "cal", "sage"].includes(site.biome) ? 1 : 0.3;
  set(t.hiss.g.gain, 0.02 * grassy * Math.pow(g, 2));
  set(t.low.g.gain, 0.022 + 0.02 * g);
  if (t.rumble) {
    const swell = 0.045 + 0.02 * Math.sin(now * 0.42 + 1);
    set(t.rumble.g.gain, (site.water.lakeSurf ? 0.4 : 1) * swell);
  }
  set(t.rain.g.gain, weather.rain * 0.05);
  /* rain suppresses; gusts duck the distant bed a touch via master wet */
}

/* --------------------------------------------- scheduled water events ---- */
function waveBuf(big) {
  /* one breaking wave: build -> break -> wash with shell rattle */
  const dur = ru(5, 8), n = (dur * SR) | 0, x = new Float32Array(n);
  const bld = bpA(noiseA(n), 300, 0.8), brk = bpA(noiseA(n), 1400, 0.6), wsh = bpA(noiseA(n), 3200, 0.7);
  const tb = ru(0.3, 0.42);       /* break point */
  for (let i = 0; i < n; i++) {
    const tf = i / n;
    const build = tf < tb ? Math.pow(tf / tb, 2.2) : Math.max(0, 1 - (tf - tb) * 6);
    const crash = tf < tb ? 0 : Math.exp(-(tf - tb) * 5.5);
    const wash = tf < tb ? 0 : Math.exp(-(tf - tb) * 2.6) * (0.6 + 0.4 * Math.sin(2 * Math.PI * 2.1 * tf * dur));
    x[i] = bld[i] * build * 0.7 + brk[i] * crash * big + wsh[i] * wash * 0.5;
  }
  /* shell/pebble rattle in the backwash */
  const rs = ((tb + 0.12) * n) | 0;
  for (let k = 0, m = ri(20, 45); k < m; k++) {
    const at = rs + (ru(0, 0.4) * n) | 0;
    const L = (0.004 * SR) | 0;
    for (let i = 0; i < L && at + i < n; i++)
      x[at + i] += (Math.random() * 2 - 1) * Math.exp(-i / (SR * 0.001)) * 0.12 * Math.exp(-((at + i) / n - tb) * 3);
  }
  return normA(x);
}
function lapBuf() {
  const dur = ru(0.5, 1), n = (dur * SR) | 0;
  const x = bpA(noiseA(n), ru(400, 800), 1.1);
  for (let i = 0; i < n; i++) x[i] *= Math.pow(Math.sin(Math.PI * i / n), 1.4);
  return normA(x);
}
function bubbleBuf() {
  const n = (0.06 * SR) | 0, x = new Float32Array(n);
  const f = ru(400, 1100);
  for (let i = 0; i < n; i++) { const t = i / SR;
    x[i] = Math.sin(2 * Math.PI * f * (1 + 3 * t) * t) * Math.exp(-t / 0.018); }
  return x;
}
function dripBuf() {
  const n = (0.12 * SR) | 0, x = new Float32Array(n);
  const f = ru(700, 1400);
  for (let i = 0; i < n; i++) { const t = i / SR;
    x[i] = Math.sin(2 * Math.PI * f * (1 + 6 * Math.exp(-t / 0.01)) * t) * Math.exp(-t / 0.03); }
  return scaleA(x, 0.5);
}
function thunderBuf(far) {
  const dur = ru(4, 9), n = (dur * SR) | 0;
  const x = bpA(noiseA(n), far ? 55 : 80, 0.5);
  const rolls = ri(2, 4);
  for (let i = 0; i < n; i++) {
    const tf = i / n; let env = 0;
    for (let r = 0; r < rolls; r++) {
      const c = 0.1 + 0.8 * r / rolls;
      env += Math.exp(-Math.pow((tf - c) * 7, 2)) * (1 - 0.2 * r);
    }
    x[i] *= env * 3;
  }
  if (!far) {  /* near strike: initial crack */
    const c = noiseA((0.08 * SR) | 0);
    for (let i = 0; i < c.length; i++) c[i] *= Math.exp(-i / (SR * 0.02)) * 0.9;
    addTo(x, hpA(c, 900), 0);
  }
  return normA(x);
}
const waterEvents = [];   /* [{nextT, kind}] built per site */
function buildWaterEvents() {
  waterEvents.length = 0;
  const w = site.water;
  if (w.surf) waterEvents.push({ kind: "wave", per: [6, 12], nextT: 0 });
  if (w.lakeSurf) waterEvents.push({ kind: "lakewave", per: [3, 7], nextT: 0 });
  if (w.lake && !w.lakeSurf) waterEvents.push({ kind: "lap", per: [1.5, 4], nextT: 0 });
  if (w.stream) waterEvents.push({ kind: "bubble", per: [0.4, 1.6], nextT: 0 });
  if (w.marsh || site.biome === "flwet") waterEvents.push({ kind: "plop", per: [8, 25], nextT: 0 });
}
function scheduleWater(now, horizon) {
  for (const ev of waterEvents) {
    if (ev.nextT < now - 1) ev.nextT = now + ru(0, 1);
    while (ev.nextT < now + horizon) {
      const t = ev.nextT;
      const vA = P.vAir;
      if (ev.kind === "wave")
        play(waveBuf(ru(0.7, 1.15)), t, { dist: ru(0.15, 0.35), pan: ru(-0.7, 0.7), gain: 0.75 * vA, group: "air", rev: 0.08 });
      else if (ev.kind === "lakewave")
        play(waveBuf(ru(0.25, 0.5)), t, { dist: ru(0.25, 0.5), pan: ru(-0.7, 0.7), gain: 0.4 * vA, group: "air", rev: 0.1 });
      else if (ev.kind === "lap")
        play(lapBuf(), t, { dist: ru(0.2, 0.5), pan: ru(-0.8, 0.8), gain: 0.28 * vA, group: "air", rev: 0.1 });
      else if (ev.kind === "bubble")
        play(bubbleBuf(), t, { dist: ru(0.1, 0.4), pan: ru(-0.5, 0.5), gain: ru(0.1, 0.3) * vA, group: "air", rev: 0.1 });
      else if (ev.kind === "plop")
        play(bubbleBuf(), t, { dist: ru(0.3, 0.6), pan: ru(-0.8, 0.8), gain: ru(0.15, 0.4) * vA, group: "air", rev: 0.25 });
      ev.nextT = t + ru(ev.per[0], ev.per[1]);
    }
  }
  /* rain drops & canopy drips */
  if (weather.rain > 0.05) {
    const rate = 4 + weather.rain * 30;
    let t = now + ru(0, 1 / rate);
    while (t < now + horizon) {
      play(dripBuf(), t, { dist: ru(0.05, 0.5), pan: ru(-0.9, 0.9), gain: ru(0.1, 0.4) * weather.rain * P.vAir, group: "air", rev: 0.1 });
      t += ru(0.3, 1.5) / rate * 2;
    }
  }
  if (weather.drip > 0.05 && arng() < weather.drip * 0.5) {
    play(dripBuf(), now + ru(0, horizon), { dist: ru(0.05, 0.4), pan: ru(-0.9, 0.9), gain: ru(0.1, 0.35) * P.vAir, group: "air", rev: 0.2 });
  }
}

/* ----------------------------------------------------------- weather ----- */
let weather = { wind: 0.35, rain: 0, drip: 0, fog: 0, thunder: false, snow: 0, plan: null };
function planWeather() {
  /* seeded per site+day: rain windows (solar hours), wind bias, fog morning */
  wrng = mulberry32(fnv("wx:" + site.key + ":" + dayStr));
  const b = site.biome, doy = P.doy;
  const summer = inDoy(doy, 150, 250), winter = inDoy(doy, 320, 60);
  let pRain = { pnw: winter ? 0.6 : 0.18, efor: 0.22, bor: 0.22, sepine: 0.28, flwet: summer ? 0.45 : 0.15,
                tgrass: 0.25, sgrass: 0.15, son: summer ? 0.22 : 0.03, chih: summer ? 0.2 : 0.04,
                sage: 0.1, mont: summer ? 0.3 : 0.15, cal: winter ? 0.3 : 0.02,
                acoast: 0.2, pcoast: winter ? 0.5 : 0.12 }[b] ?? 0.2;
  const windows = [];
  if (wrng() < pRain) {
    const storm = (b === "tgrass" || b === "sgrass" || b === "sepine" || b === "flwet"
                || (b === "son" && summer) || (b === "mont" && summer));
    const start = storm ? ru2(wrng, 13, 18) : ru2(wrng, 0, 22);
    windows.push({ start, len: storm ? ru2(wrng, 0.7, 2) : ru2(wrng, 2, 7),
                   int: storm ? ru2(wrng, 0.6, 1) : ru2(wrng, 0.25, 0.7), thunder: storm });
  }
  const fogDay = wrng() < ({ pnw: 0.5, pcoast: 0.55, cal: 0.35, acoast: 0.25, efor: 0.2, bor: 0.25 }[b] ?? 0.1);
  weather.plan = { windows, windBias: 0.2 + 0.5 * wrng(), fogDay };
}
function ru2(r, a, b) { return a + r() * (b - a); }
function stepWeather(e) {
  const pl = weather.plan;
  let rain = 0, thunder = false;
  for (const w of pl.windows) {
    const dh = (e.hour - w.start + 24) % 24;
    if (dh < w.len) { rain = w.int * Math.sin(Math.PI * Math.min(1, dh / w.len)); thunder = w.thunder; }
    else if (dh < w.len + 1.5) weather.drip = Math.max(weather.drip, 0.5 * (1 - (dh - w.len) / 1.5));
  }
  weather.rain += (rain - weather.rain) * 0.1;
  weather.thunder = thunder && weather.rain > 0.15;
  weather.drip *= 0.995;
  /* wind: windier afternoons, day-biased, plus the plan's own character */
  const diurnal = 0.4 + 0.6 * e.day;
  weather.wind = pl.windBias * diurnal * (1 + weather.rain * 0.8);
  /* fog: pre-dawn through mid-morning where the day has it */
  weather.fog = pl.fogDay ? Math.max(0, Math.min(1, (12 - e.el) / 14)) * (e.hour < 13 ? 1 : 0.2) : 0;
  weather.snow = (e.tF < 33 && weather.rain > 0.05) ? weather.rain : 0;
  if (weather.snow) weather.rain = 0;   /* snow is silence, not hiss */
}
let thunderNext = 0;

/* ------------------------------------------------------------ agents ----- */
let agents = [];
function buildCast() {
  agents = [];
  arng = mulberry32(fnv("cast:" + site.key + ":" + dayStr));
  const list = CASTS[site.biome] || [];
  const w = site.water;
  for (const id of list) {
    const sp = SP[id];
    if (!sp) continue;
    /* site gating */
    if (sp.g === "frog" && !(w.marsh || w.lake || w.stream || site.biome === "flwet")) continue;
    if (id === "loon" && !w.lake) continue;
    if (id === "train" && !site.town) continue;
    if ((id === "rooster" || id === "fardog" || id === "cattle") && !site.farm) continue;
    if ((id === "canyonwren" || id === "rockfall") && !site.rocky) continue;
    if (id === "icewhine" && !w.lake) continue;
    if (id === "sandhill" && !(w.marsh || site.biome === "flwet" || site.biome === "tgrass")) continue;
    const nn = ri2(arng, sp.n ? sp.n[0] : 1, sp.n ? sp.n[1] : 1);
    for (let k = 0; k < nn; k++) {
      agents.push({
        sp, dist: ru2(arng, sp.dist[0], sp.dist[1]),
        pan: ru2(arng, -0.9, 0.9),
        nextT: -1, idx: agents.length,
      });
    }
  }
}
function ri2(r, a, b) { return Math.floor(ru2(r, a, b + 1)); }

/* ---------------------------------------------------------- announce ----- */
const heardNames = [];
function announce(name, dist) {
  const label = dist > 0.72 && !name.startsWith("a ") ? name + ", far off" : name;
  if (heardNames.some(h => h.label === label)) return;
  heardNames.push({ label, t: performance.now() });
  if (heardNames.length > 5) heardNames.shift();
  renderNames();
}
function renderNames() {
  const el2 = document.getElementById("voicesline");
  el2.innerHTML = "";
  for (const h of heardNames) {
    const s = document.createElement("span");
    s.textContent = h.label;
    s.style.marginRight = "18px";
    el2.appendChild(s);
  }
}
setInterval(() => {
  const now = performance.now();
  for (let i = heardNames.length - 1; i >= 0; i--)
    if (now - heardNames[i].t > 14000) heardNames.splice(i, 1);
  renderNames();
}, 3000);

/* ------------------------------------------------------------- drift ----- */
/* [ ∞ drift ]: the listener wanders the land — a slow seeded walk whose
   bearing meanders and reflects off the coasts and borders. seeded by the
   day and the starting place, so a shared link wanders the same way. */
const drift = { rng: null, bearing: 0, nextT: 0 };
function engageDrift() {
  drift.rng = mulberry32(fnv("drift:" + dayStr + ":" + (site ? site.key : "start")));
  drift.bearing = drift.rng() * 6.283;
  drift.nextT = ctx ? ctx.currentTime + 10 : 0;
}
function driftStep(now) {
  const step = 0.06, rad = Math.PI / 180;
  drift.bearing += (drift.rng() - 0.5) * 0.7;
  let moved = null;
  for (let tries = 0; tries < 5 && !moved; tries++) {
    const b = drift.bearing + tries * (drift.rng() < 0.5 ? 1.4 : -1.4);
    const na = site.lat + Math.cos(b) * step;
    const nl = site.lon + Math.sin(b) * step / Math.cos(site.lat * rad);
    if (stateAt(nl, na)) { moved = [nl, na]; if (tries) drift.bearing = b; }
  }
  if (moved) driftApply(moved[0], moved[1]);
  drift.nextT = now + 20 + drift.rng() * 12;
}
function driftApply(lon, lat) {
  const s = makeSite(lon, lat);
  if (!s) return;
  const sameWorld = s.biome === site.biome
    && JSON.stringify(s.water) === JSON.stringify(site.water)
    && s.rocky === site.rocky && s.farm === site.farm && s.town === site.town;
  const crossed = s.biome !== site.biome;
  site = s;
  if (!sameWorld && running) {
    if (crossed) {
      planWeather();
      conv.buffer = makeIR(BIOME_INFO[site.biome].family);
      echoNode.delayTime.setTargetAtTime(site.rocky ? 1.1 : 1.5, ctx.currentTime, 0.5);
      announce(BIOME_INFO[site.biome].name, 0);
    }
    buildBed(); buildWaterEvents(); buildCast();
  }
  statusLine(envNow());
}

/* --------------------------------------------------------- scheduler ----- */
let lastTick = 0;
function tick() {
  if (!running) return;
  const now = ctx.currentTime, horizon = 0.7;
  if (P.drift && drift.rng && now > drift.nextT) driftStep(now);
  const e = envNow();
  stepWeather(e);
  steerBed(now);
  scheduleWater(now, horizon);
  /* thunder */
  if (weather.thunder && now > thunderNext) {
    const far = arng() < 0.75;
    play(thunderBuf(far), now + ru(0.2, 2), { dist: far ? ru(0.6, 0.85) : ru(0.2, 0.45),
      pan: ru(-0.6, 0.6), gain: (far ? 0.8 : 1.3) * P.vAir, group: "air", rev: 0.5, name: "thunder" });
    thunderNext = now + ru(20, 70);
  }
  const densGate = P.density;
  for (const ag of agents) {
    if (ag.idx / Math.max(1, agents.length) > densGate + 0.15) continue;
    if (ag.nextT < 0) ag.nextT = now + ru2(arng, 2, Math.max(12, ag.sp.gap[1] * 0.5));
    if (ag.nextT < now - 4) ag.nextT = now + ru2(arng, 0, 3);
    while (ag.nextT < now + horizon) {
      const t = ag.nextT, sp = ag.sp;
      let act = sp.act(e);
      /* rain quiets the singers (except a couple of rain-singers) */
      if (weather.rain > 0.15 && sp.g === "bird" && !["vthrush", "pacwren"].includes(sp.id))
        act *= Math.max(0, 1 - weather.rain * 1.6);
      if (weather.snow > 0.05 && sp.g !== "air") act *= 0.25;
      if (sp.id === "foghorn") act *= weather.fog > 0.25 ? 1 : 0;
      act = Math.min(1, act * (0.35 + 0.85 * densGate));
      const gapR = sp._gap || sp.gap;
      if (act > 0.02 && arng() < act) {
        const fader = P[FADER_OF[GROUP_OF[sp.g]]];
        let x = null;
        if (fader > 0.02) { try { x = sp.gen(e); } catch (err) { console.error(sp.id, err); } }
        if (x) {
          const dur = play(x, t, {
            dist: ag.dist, pan: sp.omni ? 0 : ag.pan, gain: fader,
            group: GROUP_OF[sp.g], rev: sp.rev ?? 0.15, echo: sp.echo, omni: sp.omni,
            name: sp.name,
          });
          if (arng() < 0.6) announce(sp.name, ag.dist);
          ag.nextT = t + dur + ru2(arng, gapR[0], gapR[1]) * (0.7 + 1.6 * (1 - act));
        } else ag.nextT = t + ru2(arng, gapR[0], gapR[1]);
      } else {
        ag.nextT = t + Math.max(2, ru2(arng, gapR[0], gapR[1]) * 0.6);
      }
    }
  }
  statusLine(e);
  if (now - lastTick > 30 && P.now && !P.lapse) reflectHour();
  setTimeout(tick, 180);
}

function phaseWord(e) {
  if (e.el < -14) return "night";
  if (e.el < -6) return e.rising ? "first light" : "last light";
  if (e.el < 1) return e.rising ? "dawn" : "dusk";
  if (e.el < 12) return e.rising ? "early morning" : "evening";
  if (e.hour > 11 && e.hour < 14.5) return "midday";
  return e.rising ? "morning" : "afternoon";
}
function statusLine(e) {
  if (!site) return;
  const hm = solarHour();
  const hh = String((hm / 60) | 0).padStart(2, "0"), mm = String((hm % 60) | 0).padStart(2, "0");
  const wx = weather.snow > 0.05 ? " · snow" : weather.rain > 0.4 ? " · rain"
    : weather.rain > 0.05 ? " · light rain" : weather.fog > 0.4 ? " · fog" : "";
  document.getElementById("siteline").innerHTML =
    `${Math.abs(site.lat).toFixed(1)}°N ${Math.abs(site.lon).toFixed(1)}°W · ` +
    `<b>${BIOME_INFO[site.biome].name}</b> · ${site.region} · ` +
    `${hh}:${mm} · ${phaseWord(e)} · ${Math.round(e.tF)}°F · ${doyLabel(e.doy)}${wx}`;
}

/* ============================================================== map ====== */
const cv = document.getElementById("map"), g2 = cv.getContext("2d");
let mapCache = null, view = null;   /* view: {s, ox, oy} projected -> px */
function computeView(W, H) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const s of STATES) for (const r of s.rings) for (const [lo, la] of r) {
    const [x, y] = AB.fwd(lo, la);
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  const m = 0.045;
  const sc = Math.min(W * (1 - m * 2) / (x1 - x0), H * (1 - m * 2) / (y1 - y0));
  return { s: sc, ox: W / 2 - sc * (x0 + x1) / 2, oy: H / 2 + sc * (y0 + y1) / 2, flip: true };
}
function toPx(lon, lat) { const [x, y] = AB.fwd(lon, lat);
  return [view.ox + view.s * x, view.oy - view.s * y]; }
function fromPx(px, py) { return AB.inv((px - view.ox) / view.s, (view.oy - py) / view.s); }
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function drawBase(W, H) {
  const off = document.createElement("canvas"); off.width = W; off.height = H;
  const g = off.getContext("2d");
  /* clip to the nation, then paint the biome grid */
  g.save(); g.beginPath();
  for (const s of STATES) for (const r of s.rings) {
    r.forEach(([lo, la], i) => { const [x, y] = toPx(lo, la);
      i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.closePath();
  }
  g.clip();
  const dark = !matchMedia("(prefers-color-scheme: light)").matches
            || document.documentElement.dataset.theme === "dark";
  g.globalAlpha = dark ? 0.5 : 0.55;
  const step = 0.35;
  for (let la = 24; la < 49.5; la += step) {
    for (let lo = -125; lo < -66.5; lo += step) {
      const b = biomeAt(lo + step / 2, la + step / 2);
      g.fillStyle = BIOME_INFO[b.biome].hue;
      const p0 = toPx(lo, la), p1 = toPx(lo + step, la), p2 = toPx(lo + step, la + step), p3 = toPx(lo, la + step);
      g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]);
      g.lineTo(p2[0], p2[1]); g.lineTo(p3[0], p3[1]); g.closePath(); g.fill();
    }
  }
  g.restore();
  g.globalAlpha = 1;
  g.strokeStyle = cssVar("--rule"); g.lineWidth = 0.7;
  for (const s of STATES) for (const r of s.rings) {
    g.beginPath();
    r.forEach(([lo, la], i) => { const [x, y] = toPx(lo, la);
      i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.closePath(); g.stroke();
  }

}
function drawMap() {
  const wantW = Math.round(cv.clientWidth * devicePixelRatio),
        wantH = Math.round(cv.clientHeight * devicePixelRatio);
  if (cv.width !== wantW || cv.height !== wantH || !mapCache) {
    cv.width = wantW; cv.height = wantH;
    view = computeView(wantW, wantH);
    mapCache = drawBase(wantW, wantH);
  }
  const W = cv.width, H = cv.height;
  g2.clearRect(0, 0, W, H);
  g2.drawImage(mapCache, 0, 0);
  /* night veil follows the site's sun */
  if (site) {
    const e = envNow();
    const veil = Math.max(0, Math.min(1, (-e.el + 2) / 14)) * 0.22;
    if (veil > 0.01) { g2.fillStyle = "#06070c"; g2.globalAlpha = veil;
      g2.fillRect(0, 0, W, H); g2.globalAlpha = 1; }
    const [mx, my] = toPx(site.lon, site.lat);
    g2.strokeStyle = cssVar("--s1"); g2.lineWidth = devicePixelRatio;
    g2.beginPath(); g2.moveTo(mx - 7 * devicePixelRatio, my); g2.lineTo(mx + 7 * devicePixelRatio, my);
    g2.moveTo(mx, my - 7 * devicePixelRatio); g2.lineTo(mx, my + 7 * devicePixelRatio); g2.stroke();
    /* sound ripples around the listener */
    if (running) {
      const now = ctx.currentTime;
      for (let i = visEvents.length - 1; i >= 0; i--) {
        const ev = visEvents[i], age = now - ev.t;
        const life = Math.min(4, ev.dur + 1);
        if (age > life) { visEvents.splice(i, 1); continue; }
        if (age < 0) continue;
        const u = age / life;
        const ang = -Math.PI / 2 + ev.pan * 1.1;
        const rr = (10 + ev.dist * 42) * devicePixelRatio;
        const x = mx + Math.cos(ang) * rr, y = my + Math.sin(ang) * rr;
        g2.beginPath();
        g2.arc(x, y, (2 + u * 26) * devicePixelRatio, 0, 6.284);
        g2.strokeStyle = cssVar(ev.name && ev.name.includes("thunder") ? "--cool" : "--warm");
        g2.globalAlpha = (1 - u) * 0.55;
        g2.lineWidth = devicePixelRatio;
        g2.stroke(); g2.globalAlpha = 1;
      }
    }
  }
  requestAnimationFrame(() => { if (drawLive) drawMap(); });
}
let drawLive = false;

/* ----------------------------------------------------- interactions ------ */
function setSite(lon, lat, announceIt = true) {
  let s = makeSite(lon, lat);
  if (!s) {   /* clicked the sea: snap to the nearest coast */
    const c = coastNear(lon, lat);
    if (c.deg < 2.5) {
      let best = null, bd = 1e9;
      const ky = Math.cos(lat * Math.PI / 180);
      for (const t of ["p", "a", "g", "l"]) for (const [cx, cy] of COAST[t]) {
        const d = Math.hypot((cx - lon) * ky, cy - lat);
        if (d < bd) { bd = d; best = [cx, cy]; }
      }
      if (best) {
        /* nudge slightly inland toward the continent's center */
        for (const f of [0.03, 0.08, 0.15, 0.25]) {
          const nl = best[0] + (-96 - best[0]) * f * 0.02, na = best[1] + (39 - best[1]) * f * 0.02;
          s = makeSite(nl, na); if (s) break;
        }
        if (!s) s = makeSite(best[0], best[1]);
      }
    }
    if (!s) return;
  }
  site = s;
  planWeather();
  if (running) {
    buildBed(); buildWaterEvents(); buildCast(); heardNames.length = 0; renderNames();
    conv.buffer = makeIR(BIOME_INFO[site.biome].family);
    echoNode.delayTime.setTargetAtTime(site.rocky ? 1.1 : 1.5, ctx.currentTime, 0.5);
    visEvents.length = 0;
  }
  const e = envNow();
  statusLine(e);
  if (!running) {
    document.getElementById("siteline").innerHTML =
      `${site.lat.toFixed(1)}°N ${Math.abs(site.lon).toFixed(1)}°W · <b>${BIOME_INFO[site.biome].name}</b> · ${site.region} — press [ begin ]`;
    drawMap();   /* one frame; the rAF loop stays off until begin */
  }
}
cv.addEventListener("pointerdown", e => {
  const r = cv.getBoundingClientRect();
  const px = (e.clientX - r.left) * devicePixelRatio, py = (e.clientY - r.top) * devicePixelRatio;
  if (!view) return;
  const [lon, lat] = fromPx(px, py);
  setSite(lon, lat);
}, { passive: true });

function randomSite() {
  for (let k = 0; k < 200; k++) {
    const s = STATES[(Math.random() * STATES.length) | 0];
    const [x0, y0, x1, y1] = s.bbox;
    const lon = ru(x0, x1), lat = ru(y0, y1);
    if (stateAt(lon, lat)) { setSite(lon, lat); return; }
  }
}

/* ------------------------------------------------------------- UI -------- */
const el = new Proxy({}, { get: (t, k) => document.getElementById(k) });
const out = id => document.getElementById(id + "V");
function fmtHour(mins) {
  return String((mins / 60) | 0).padStart(2, "0") + ":" + String((mins % 60) | 0).padStart(2, "0");
}
function reflectHour() {
  const hm = solarHour();
  el.hour.value = Math.round(hm); out("hour").textContent = fmtHour(hm);
  lastTick = ctx ? ctx.currentTime : 0;
}
el.hour.addEventListener("input", () => {
  P.now = false; P.lapse = false; lapseBase = null;
  el.now.setAttribute("aria-checked", "false"); el.lapse.setAttribute("aria-checked", "false");
  P.hour = +el.hour.value; out("hour").textContent = fmtHour(P.hour);
});
el.doy.addEventListener("input", () => {
  P.doy = +el.doy.value; out("doy").textContent = doyLabel(P.doy);
  if (site) planWeather();
});
el.now.addEventListener("click", () => {
  P.now = !P.now;
  if (P.now) { P.lapse = false; lapseBase = null; el.lapse.setAttribute("aria-checked", "false"); }
  el.now.setAttribute("aria-checked", String(P.now));
  if (P.now) reflectHour();
});
el.lapse.addEventListener("click", () => {
  P.lapse = !P.lapse;
  if (P.lapse) {
    lapseBase = { real: performance.now() / 1000, hour: solarHour() };
    P.now = false; el.now.setAttribute("aria-checked", "false");
  } else lapseBase = null;
  el.lapse.setAttribute("aria-checked", String(P.lapse));
});
el.today.addEventListener("click", () => {
  const d = new Date();
  P.doy = Math.max(1, Math.min(365, Math.round((d - new Date(d.getFullYear(), 0, 0)) / 86400000)));
  el.doy.value = P.doy; out("doy").textContent = doyLabel(P.doy);
  if (site) planWeather();
});
function bind(id, key, fmt, scale = 0.01) {
  el[id].addEventListener("input", () => {
    P[key] = el[id].value * scale;
    out(id).textContent = fmt(P[key]);
  });
}
const WINDWORDS = ["dead calm", "still", "drifting", "breezy", "windy", "gusty", "roaring"];
bind("density", "density", v => Math.round(v * 100));
bind("wind", "wind", v => WINDWORDS[Math.min(6, (v * 7) | 0)]);
bind("space", "space", v => { if (wetGain) wetGain.gain.value = v * 0.9; return Math.round(v * 100); });
bind("vBird", "vBird", v => Math.round(v * 100));
bind("vBug", "vBug", v => Math.round(v * 100));
bind("vFrog", "vFrog", v => Math.round(v * 100));
bind("vFauna", "vFauna", v => Math.round(v * 100));
bind("vAir", "vAir", v => Math.round(v * 100));
el.drift.addEventListener("click", () => {

  el.drift.setAttribute("aria-checked", String(P.drift));
  if (P.drift) engageDrift();
});
out("doy").textContent = doyLabel(P.doy); el.doy.value = P.doy;
out("wind").textContent = WINDWORDS[Math.min(6, (P.wind * 7) | 0)];

el.jump.addEventListener("click", randomSite);
el.share.addEventListener("click", async () => {
  if (!site) return;
  const u = location.origin + location.pathname
    + `?lat=${site.lat.toFixed(2)}&lon=${site.lon.toFixed(2)}&day=${dayStr}`;
  try { await navigator.clipboard.writeText(u); el.share.textContent = "[ copied ]"; }
  catch (e) { el.share.textContent = "[ " + u + " ]"; }
  setTimeout(() => el.share.textContent = "[ share this place ]", 2500);
});

/* --------------------------------------------------------- recorder ------ */
/* one multichannel tap: the linear mix plus each stem (album convention:
   birds + insects + frogs + fauna + air + space sum back to the mix exactly;
   the live compressor sits after this point and is not recorded). */
const REC_S = 90;
const STEMS = ["mix", "birds", "insects", "frogs", "fauna", "air", "space"];
let recRing = null, recCh = 2, recPos = 0, recFill = 0, recNode = null;
function startRecorder() {
  const buses = [sum, groups.bird.dry, groups.bug.dry, groups.frog.dry,
                 groups.fauna.dry, groups.air.dry, space];
  let taps = buses;
  try { recRing = new Int16Array(REC_S * SR * 2 * buses.length); recCh = buses.length * 2; }
  catch (e) { recRing = new Int16Array(REC_S * SR * 2); recCh = 2; taps = [sum]; }
  const merger = ctx.createChannelMerger(recCh);
  taps.forEach((b, i) => { const sp = ctx.createChannelSplitter(2); b.connect(sp);
    sp.connect(merger, 0, i * 2); sp.connect(merger, 1, i * 2 + 1); });
  recNode = ctx.createScriptProcessor(4096, recCh, 1);
  merger.connect(recNode);
  recNode.onaudioprocess = ev => {
    const L = ev.inputBuffer.length, nCh = ev.inputBuffer.numberOfChannels;
    const ch = []; for (let c = 0; c < recCh; c++) ch.push(c < nCh ? ev.inputBuffer.getChannelData(c) : null);
    for (let i = 0; i < L; i++) {
      for (let c = 0; c < recCh; c++) {
        const v = (ch[c] ? ch[c][i] : 0) * 0.7;      /* headroom on the linear sum */
        recRing[recPos++] = Math.max(-32768, Math.min(32767, (v * 32767) | 0));
      }
      if (recPos >= recRing.length) recPos = 0;
    }
    recFill = Math.min(recFill + L, REC_S * SR);
  };
  const mute = ctx.createGain(); mute.gain.value = 0;
  recNode.connect(mute); mute.connect(ctx.destination);
}
function buildWavPair(pair) {
  if (!recFill || pair * 2 + 1 >= recCh) return null;
  const frames = recFill, bytes = frames * 4;
  const buf = new ArrayBuffer(44 + bytes), dv = new DataView(buf);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, "RIFF"); dv.setUint32(4, 36 + bytes, true); ws(8, "WAVE"); ws(12, "fmt ");
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true);
  dv.setUint32(24, SR, true); dv.setUint32(28, SR * 4, true);
  dv.setUint16(32, 4, true); dv.setUint16(34, 16, true);
  ws(36, "data"); dv.setUint32(40, bytes, true);
  let base = recPos - frames * recCh;
  if (base < 0) base += recRing.length;
  for (let i = 0; i < frames; i++) {
    dv.setInt16(44 + i * 4, recRing[base + pair * 2], true);
    dv.setInt16(44 + i * 4 + 2, recRing[base + pair * 2 + 1], true);
    base += recCh; if (base >= recRing.length) base -= recRing.length;
  }
  return new Uint8Array(buf);
}
/* store-method zip, written by hand in the house manner */
const CRC_T = (() => { const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files) {
  const enc = new TextEncoder(), chunks = [], central = [];
  const u32 = v => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
  const u16 = v => [v & 255, (v >>> 8) & 255];
  let off = 0;
  for (const f of files) {
    const nm = enc.encode(f.name), crc = crc32(f.data);
    const head = new Uint8Array([0x50, 0x4B, 3, 4, ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
      ...u32(crc), ...u32(f.data.length), ...u32(f.data.length), ...u16(nm.length), ...u16(0), ...nm]);
    central.push({ nm, crc, size: f.data.length, off });
    chunks.push(head, f.data); off += head.length + f.data.length;
  }
  const cdStart = off; let cdLen = 0;
  for (const c of central) {
    const rec = new Uint8Array([0x50, 0x4B, 1, 2, ...u16(20), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
      ...u32(c.crc), ...u32(c.size), ...u32(c.size), ...u16(c.nm.length), ...u16(0), ...u16(0),
      ...u16(0), ...u16(0), ...u32(0), ...u32(c.off), ...c.nm]);
    chunks.push(rec); cdLen += rec.length;
  }
  chunks.push(new Uint8Array([0x50, 0x4B, 5, 6, ...u16(0), ...u16(0), ...u16(central.length), ...u16(central.length),
    ...u32(cdLen), ...u32(cdStart), ...u16(0)]));

}
function keepName(ext) {
  const hm = new Date();
  return "elsewhere-" + (site ? site.key.replace(/[.,]/g, "_") : "somewhere") + "-"
    + dayStr.replaceAll("-", "")
    + String(hm.getHours()).padStart(2, "0") + String(hm.getMinutes()).padStart(2, "0") + ext;
}
async function saveFile(btn, idleLabel, name, bytes, mime) {
  const say = (t, ms) => { btn.textContent = t;
    if (ms) setTimeout(() => btn.textContent = idleLabel, ms); };
  const dl = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null;
  if (dl) {
    try { await dl.save({ filename: name, data: bytes }); say("[ kept ]", 1400); }
    catch (err) {
      if (err && err.code === "declined") say(idleLabel);
      else say("[ unavailable here ]", 1600);
    }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([bytes], { type: mime }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 6000);
  say("[ kept ]", 1400);
}
el.keep.addEventListener("click", async () => {
  const bytes = buildWavPair(0);
  if (!bytes) { el.keep.textContent = "[ nothing yet ]";
    setTimeout(() => el.keep.textContent = "[ keep .wav ]", 1400); return; }
  await saveFile(el.keep, "[ keep .wav ]", keepName(".wav"), bytes, "audio/wav");
});
el.stems.addEventListener("click", async () => {
  const btn = el.stems;
  if (!recFill || recCh < 4) { btn.textContent = recCh < 4 ? "[ unavailable here ]" : "[ nothing yet ]";
    setTimeout(() => btn.textContent = "[ keep stems ]", 1600); return; }
  btn.textContent = "[ gathering… ]";
  await new Promise(r => setTimeout(r, 30));   /* let the label paint */
  const files = [];
  for (let p = 0; p < STEMS.length; p++) {
    const w = buildWavPair(p);
    if (w) files.push({ name: STEMS[p] + ".wav", data: w });
  }
  const blob = zipStore(files);
  const bytes = new Uint8Array(await blob.arrayBuffer());
  await saveFile(btn, "[ keep stems ]", keepName("-stems.zip"), bytes, "application/zip");
});

/* ------------------------------------------------------------ begin ------ */
el.begin.addEventListener("click", async () => {
  if (running) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  SR = ctx.sampleRate;
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
  await ctx.resume();
  ctx.onstatechange = () => { if (ctx.state !== "running" && !document.hidden) ctx.resume(); };
  document.addEventListener("touchend", () => {
    if (ctx && ctx.state !== "running") ctx.resume();
  }, { passive: true });
  const grabLock = () => { if (navigator.wakeLock)
    navigator.wakeLock.request("screen").catch(() => {}); };
  grabLock();
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    if (ctx && ctx.state !== "running") ctx.resume();
    grabLock();
  });

  comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 2.5; comp.attack.value = 0.012; comp.release.value = 0.25;
  master = ctx.createGain(); master.gain.value = 0.9;
  comp.connect(master); master.connect(ctx.destination);
  /* the mix is LINEAR at `sum` (stems sum back exactly, album convention);
     the compressor after it only guards live playback */
  sum = ctx.createGain(); sum.connect(comp);
  space = ctx.createGain(); space.connect(sum);
  wetGain = ctx.createGain(); wetGain.gain.value = P.space * 0.9;
  for (const gname of ["bird", "bug", "frog", "fauna", "air"]) {
    const dry = ctx.createGain(), wet = ctx.createGain();
    dry.gain.value = 0.85; wet.gain.value = 1;
    dry.connect(sum); wet.connect(wetGain);
    groups[gname] = { dry, wet };
  }
  if (!site) randomSite();
  conv = ctx.createConvolver();
  conv.buffer = makeIR(BIOME_INFO[site.biome].family);
  wetGain.connect(conv); conv.connect(space);
  /* discrete echo (canyons, lake loons) */
  echoNode = ctx.createDelay(3); echoNode.delayTime.value = site.rocky ? 1.1 : 1.5;
  const efb = ctx.createGain(); efb.gain.value = 0.3;
  const elp = ctx.createBiquadFilter(); elp.type = "lowpass"; elp.frequency.value = 2100;
  echoGain = ctx.createGain(); echoGain.gain.value = 0.35;
  echoNode.connect(elp); elp.connect(efb); efb.connect(echoNode);
  elp.connect(echoGain); echoGain.connect(space);

  running = true;
  buildBed(); buildWaterEvents(); buildCast();
  startRecorder();
  el.begin.remove();
  reflectHour();
  drawLive = true;
  tick(); drawMap();
});

/* ------------------------------------------------- url site + initial ---- */
(() => {
  const qlat = parseFloat(params.get("lat")), qlon = parseFloat(params.get("lon"));
  requestAnimationFrame(() => { drawMap(); if (!isNaN(qlat) && !isNaN(qlon)) setSite(qlon, qlat); });
  addEventListener("resize", () => { if (!drawLive) drawMap(); });
  const qh = parseFloat(params.get("h"));
  if (!isNaN(qh)) { P.now = false; P.hour = qh * 60;
    el.now.setAttribute("aria-checked", "false");
    el.hour.value = P.hour; out("hour").textContent = fmtHour(P.hour); }
})();
